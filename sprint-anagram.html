<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Sprint — anagram sprint</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"><style>
:root{--ink:#10142b;--card:#fff8ea;--mute:#7a7d92;--line:#e6dec9;--g:#2ec4a0;--r:#ff5d4e;--y:#ffc933;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:"Space Grotesk",system-ui,sans-serif;color:var(--ink);min-height:100vh;background:#8fd3ff;transition:background-color 1.6s;overflow-x:hidden}
#st{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 2s}#st i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}

.lede{color:var(--mute);line-height:1.5;margin:14px 0 20px}
.btn{font:700 1rem "Space Grotesk",sans-serif;border:2px solid var(--ink);border-radius:999px;background:var(--ink);color:var(--card);padding:12px 22px;cursor:pointer;transition:transform .15s,background .2s}.btn:hover{background:var(--r);border-color:var(--r)}.btn:active{transform:scale(.95)}.btn.ghost{background:transparent;color:var(--ink)}.btn.ghost:hover{background:var(--ink);border-color:var(--ink);color:var(--card)}

.big{font-size:clamp(4rem,20vw,6.5rem);font-weight:700;letter-spacing:-.07em;line-height:.9;margin:4px 0 8px}.big small{font-size:.28em;letter-spacing:-.02em;color:var(--mute)}
.no{animation:nope .4s}.fr::after{content:"";position:absolute;inset:0;background:var(--r);opacity:0;pointer-events:none;animation:fr .4s}
.timer{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:0 0 14px}.timer i{display:block;height:100%;width:100%;background:var(--ink);border-radius:4px}.timer i.low{background:var(--r);animation:pu .5s linear infinite}
.ch{display:inline-block;margin:4px 4px 0 0;padding:6px 12px;border-radius:999px;font-weight:700;font-size:.9rem;background:#fff;animation:pop .4s cubic-bezier(.2,1.4,.4,1) both}.l4{background:#c5f1e5}.l5{background:#cfe0ff}.l6{background:var(--y)}.miss{opacity:.6;font-weight:500;animation:rise .4s both;animation-delay:calc(var(--i)*25ms)}
.spk{position:absolute;left:50%;top:35%;width:9px;height:9px;border-radius:2px;background:var(--sc);opacity:0;animation:spk 1.4s ease-out var(--dl) forwards;z-index:3}
.ban{position:absolute;left:0;right:0;top:32%;text-align:center;z-index:4;pointer-events:none;animation:ban 1.8s ease-out forwards}.ban span{display:inline-block;background:var(--ink);color:var(--c);font-weight:700;letter-spacing:.25em;text-transform:uppercase;font-size:.9rem;padding:9px 20px;border-radius:999px}

@keyframes flip{from{opacity:0;transform:perspective(300px) rotateX(-90deg)}}@keyframes hop{40%{transform:translateY(-14px)}}
@keyframes nope{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}@keyframes slide{from{opacity:0;transform:translateX(-20px)}}

#lad{display:flex;flex-direction:column-reverse;gap:6px;margin:6px auto;max-width:300px;padding:8px 14px;border-left:5px solid var(--ink);border-right:5px solid var(--ink);border-radius:8px}

.tl.s.ov .t{color:var(--r);box-shadow:0 4px 0 var(--r)}.tl.s.ov .t.on{background:var(--r);color:#fff}.tl.s.win .t{background:var(--g);color:var(--ink)}
.st small{display:block;color:var(--mute);font-size:.72rem;margin-top:2px;font-weight:400;line-height:1.4}

.mx{font-size:2.3rem;font-weight:700;color:var(--r);letter-spacing:-.05em}
.heat{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:8px 0}.heat i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--y),var(--r))}
.pp{animation:pp .35s cubic-bezier(.2,1.6,.4,1)}.bp{animation:bp .25s}body.fever .card{animation:fev .7s ease-in-out infinite alternate}
@keyframes pp{40%{transform:scale(1.4)}}@keyframes bp{30%{transform:scale(1.025) rotate(.5deg)}}@keyframes fev{to{box-shadow:0 0 0 4px var(--y),0 0 44px 8px rgba(255,201,51,.75)}}

.back:hover{background:var(--ink);color:var(--card)}

</style></head><body><div id="st"></div><main><div class="pill"><div style="display:flex;align-items:center;gap:10px"><a href="index.html" class="back" title="Back to Oddly">← Oddly</a><b>Sprint</b></div><span id="hd">Daily</span></div><div id="v"></div></main><script>
const WORDS="ale ant ape apt arm art ate cat cot ear eat era fin fir fig gin lap lea let lit net nap one opt ore owe own pal pan pat pea pen pet per pot rag ran rat red rep rig rot row run sat sea set sin sit tan tap tar tea ten tie tin toe top won woe now nor rod ode don doe end den and age are gad nag orc ram mat sac leap lane lean lent neat pale pane pant pate peat pelt pent plan plea tale teal late seam same mate meat team tame tear tare rate rest star tars arts rats ears eats east seat teas sear mast mart tram term arms rams stem mare dare dear read rend nerd gear rage rang aged dean near earn darn case cast cats lace last sale salt slat lest lets acts line lint list lens nest nets sent tens site sine tile tine silt slit tins lies ties isle lien gone gore ogre roan fire fine fern ring grin rein rife rock core cork coke cote rote tore opts pest pore port post pots rope rots sort spot step stop tops pose rose sore down done node word wore wend wren redo rode owed bake bale bare base bone bore bold bolt bond bell belt bill ball bull burn cage cake came cane care cart cave cold cord corn cone dame date dime dine dire dome dove fade fake fame fate file fill film five flat gale game gate gave hale hare hate have hole home hope hose hide hike hire kite lake lame lore lose love mile mine mole more mule nine none note pile pine pipe poke pole rice ride rile rise rule safe sage sake sole some tube tune vale vane vile wade wage wake wane ware wave wide wine wire wise back bank band bark barn bend bent best bird bite boat boil book boom boss call calm camp card cash chat chop clap clay coal coat cook cool cost dark dash deal deck deep desk dish dock doll door dust fall farm fast feel fell felt fish fist foot fork form gift girl glad goal gold golf good hall hand hang hard harm head heal heap hear heat help hill hold hood hook hurt jump keep kick king lamp land lock look loop luck mask mind mist moon mild mill milk nail neck need pack page pain pair park pass past path pick pink plot plug pull push race rack rail rain rank rent roll room root sack sand seed sell ship shop sick sing sink skin slip snap soap sock soft soil sold soul tail talk tall tank task test tent tick toll tool town trip walk wall warm wash weed well went wild will wind wing wolf wood wool work yard plane plant plate panel petal pleat leapt steam mates meats tames teams smart marts trams terms tears rates stare aster tares anger range grand scale laces least steal slate stale tales teals cleat caste inlet islet stile stein lines tiles organ groan argon goner finer reign store poets prose spore ports sport strop drone owner planet stream master garden danger gander ranged castle cleats silent listen tinsel enlist inlets orange finger fringe poster presto repost tropes wonder downer",NAME="sprint";

const _d=new Date();
const localDateStr=`${_d.getFullYear()}-${String(_d.getMonth()+1).padStart(2,'0')}-${String(_d.getDate()).padStart(2,'0')}`;
const API_BASE = "https://sprint-backend.adityapdixit.workers.dev";
const sessionKey = "sprint_session_" + localDateStr;
let sessionUUID = localStorage.getItem(sessionKey);
if (!sessionUUID) {
  sessionUUID = (crypto.randomUUID ? crypto.randomUUID() : "sess_" + Math.random().toString(36).slice(2) + Date.now().toString(36));
  localStorage.setItem(sessionKey, sessionUUID);
}

const $=id=>document.getElementById(id),R=Math.random;
const T=Math.floor(Date.UTC(_d.getFullYear(),_d.getMonth(),_d.getDate())/864e5),num=T-Math.floor(Date.UTC(2026,0,1)/864e5)+1,KEY=NAME+":"+localDateStr;
const mb=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296},vib=v=>{try{navigator.vibrate&&navigator.vibrate(v)}catch(e){}};
const ST=[[0,"#8fd3ff"],[.2,"#4a95ee"],[.4,"#2f55bd"],[.6,"#1b2a73"],[.8,"#0b1033"],[1,"#04050d"]],hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function sky(t){t=Math.max(0,Math.min(1,t));let i=0;while(i<ST.length-2&&t>ST[i+1][0])i++;const a=ST[i],b=ST[i+1],k=(t-a[0])/(b[0]-a[0]),x=hx(a[1]),y=hx(b[1]);document.body.style.backgroundColor="rgb("+x.map((v,j)=>Math.round(v+(y[j]-v)*k)).join(",")+")";$("st").style.opacity=Math.max(0,Math.min(1,(t-.45)*2.2))}
$("st").innerHTML=Array.from({length:70},()=>`<i style="left:${R()*100}%;top:${R()*100}%;animation-delay:${R()*3}s"></i>`).join("");
const shake=e=>{e.classList.remove("no");void e.offsetWidth;e.classList.add("no")},fr=e=>{e.classList.remove("fr");void e.offsetWidth;e.classList.add("fr")};
function burst(el,cols,n=30){for(let j=0;j<n;j++){const e=document.createElement("i");e.className="spk";e.style.cssText=`--dx:${(R()-.5)*440}px;--dy:${(R()-.4)*320}px;--dl:${R()*.3}s;--sc:${cols[j%cols.length]}`;el.appendChild(e);setTimeout(()=>e.remove(),2000)}}
function ban(el,t,c){const e=document.createElement("div");e.className="ban";e.innerHTML=`<span style="--c:${c}">${t}</span>`;el.appendChild(e);setTimeout(()=>e.remove(),1900)}
const save=v=>{try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}},load=()=>{try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}},
cp=(t,b)=>{try{navigator.clipboard.writeText(t).then(()=>b.textContent="Copied",()=>prompt("Copy:",t))}catch(e){prompt("Copy:",t)}};
function cdown(el){const f=()=>{const x=new Date(),r=new Date(x.getFullYear(),x.getMonth(),x.getDate()+1)-x,q=y=>String(y).padStart(2,"0");el.textContent="Next one in "+q(Math.floor(r/36e5))+":"+q(Math.floor(r/6e4)%60)+":"+q(Math.floor(r/1e3)%60)};f();setInterval(f,1000)}
const W=[...new Set(WORDS.split(" "))],CK=["#2ec4a0","#ffc933","#fff","#4d8dff","#ff6fb0"];

const SK=[...new Set(W.filter(w=>w.length==6).map(w=>[...w].sort().join("")))];
let key=SK[T%SK.length];
let cnt=s=>{const o={};for(const c of s)o[c]=(o[c]||0)+1;return o},kc=cnt(key);
let can=w=>{const c=cnt(w);return Object.keys(c).every(k=>c[k]<=(kc[k]||0))};
let ANS=W.filter(w=>w.length>=3&&w.length<=6&&can(w)),PT={3:1,4:2,5:4,6:8},MAXP=ANS.reduce((a,w)=>a+PT[w.length],0),rg=mb(T*13+5);
let LT=[...key],found=[],sc=0,used=[],iv=0,prac=0,done=load(),cb=0,last=0,bm=1;
let serverMissedWords = [];

async function initSprint(){
  try {
    const res = await fetch(`${API_BASE}/api/today?date=${localDateStr}`);
    if(res.ok){
      const data = await res.json();
      if(data && data.letters && data.letters.length === 6){
        key = data.letters.toLowerCase();
        kc = cnt(key);
        can = w=>{const c=cnt(w);return Object.keys(c).every(k=>c[k]<=(kc[k]||0))};
        ANS = W.filter(w=>w.length>=3&&w.length<=6&&can(w));
        MAXP = data.maxScore || ANS.reduce((a,w)=>a+PT[w.length],0);
        LT = [...key];
        shuf();
        return;
      }
    }
  }catch(e){}
}

const pp=(e,c="pp")=>{e.classList.remove(c);void e.offsetWidth;e.classList.add(c)},F=document.body.classList;
function shuf(){for(let i=5;i>0;i--){const j=Math.floor(rg()*(i+1));[LT[i],LT[j]]=[LT[j],LT[i]]}}shuf();
function intro(){sky(0);$("hd").textContent="Daily";$("v").innerHTML=`<div class="card"><p class="kick">Sprint ${String(num).padStart(3,"0")}</p><h1>60 seconds.<br><em>Six letters.</em></h1><p class="lede">Make words from the tiles. Chain them inside 5 seconds to stack a multiplier up to ×4 and hit FEVER. One bad word and the combo dies. 3 letters = 1 point, 4 = 2, 5 = 4, all six = 8.</p><button class="btn" id="b">Go</button></div>`;$("b").onclick=play}
function tiles(c){$("lt").innerHTML=LT.map((l,i)=>`<button class="t ${c}" data-i="${i}" style="--i:${i}">${l}</button>`).join("")}
function draw(){const n=used.length;$("cw").innerHTML=n?used.map((u,i)=>`<div class="t on ${i==n-1?"a":""}" style="--i:0">${LT[u]}</div>`).join(""):`<span class="kick" style="margin:22px 0">Type or tap letters</span>`;[...$("lt").children].forEach((b,i)=>b.classList.toggle("u",used.includes(i)))}
function add(i){if(iv&&i>=0&&!used.includes(i)){used.push(i);draw()}}
function brk(){cb=0;F.remove("fever");if($("mx")){$("mx").textContent="×1";$("ht").style.width=0}}
function play(){found=[];sc=0;used=[];cb=0;bm=1;serverMissedWords=[];F.remove("fever");sky(0);$("hd").textContent="Go!";const t0=performance.now();
$("v").innerHTML=`<div class="card" id="cd0"><div class="top"><div><small>SCORE</small><b id="sc">0</b></div><div class="mx" id="mx">×1</div><div style="text-align:right"><small>TIME</small><b id="tm">60</b></div></div><div class="heat"><i id="ht"></i></div><div class="timer"><i id="tb"></i></div><div class="tl" id="cw" style="min-height:62px"></div><div class="tl" id="lt"></div><div class="row" style="justify-content:center"><button class="btn" id="go">Enter</button><button class="btn ghost" id="sh">Shuffle</button><button class="btn ghost" id="cl">Clear</button></div><div id="fd" style="margin-top:14px"></div></div>`;
tiles("a");draw();$("lt").onclick=e=>{const b=e.target.closest("button");if(b)add(+b.dataset.i)};$("go").onclick=sub;$("cl").onclick=()=>{used=[];draw()};$("sh").onclick=shfl;
clearInterval(iv);iv=setInterval(()=>{const n=performance.now(),tm=Math.max(0,60-(n-t0)/1e3);$("tb").style.width=tm/.6+"%";$("tm").textContent=Math.ceil(tm);if(tm<=10)$("tb").classList.add("low");
if(cb){const h=Math.max(0,1-(n-last)/5000);$("ht").style.width=h*100+"%";if(!h)brk()}if(tm<=0)end()},100)}
function shfl(){used=[];shuf();tiles("f");draw()}
document.onkeydown=e=>{if(!iv)return;if(e.key==="Enter")sub();else if(e.key==="Backspace"){used.pop();draw()}else if(e.key===" "){e.preventDefault();shfl()}else if(/^[a-z]$/i.test(e.key))add(LT.findIndex((c,j)=>c==e.key.toLowerCase()&&!used.includes(j)))};
function fl(t){const e=document.createElement("div");e.className="fl";e.textContent=t;$("cd0").appendChild(e);setTimeout(()=>e.remove(),950)}

async function sub(){
  const w=used.map(i=>LT[i]).join(""),cw=$("cw"),c0=$("cd0");
  if(w.length<3||found.includes(w)){
    shake(cw);pp(c0,"fr");brk();vib([60,40,60]);
    if(found.includes(w)){const c=document.querySelector('[data-w="'+w+'"]');c&&shake(c)}
    return;
  }

  // Try live server submission against authoritative word database
  try {
    const sRes = await fetch(`${API_BASE}/api/submit-word`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({session: sessionUUID, word: w, date: localDateStr})
    });
    if(sRes.ok){
      const sData = await sRes.json();
      if(!sData.valid){
        shake(cw);pp(c0,"fr");brk();vib([60,40,60]);
        return;
      }
      const p = sData.pointsEarned, m = sData.multiplier;
      sc = sData.totalScore;
      found.push(w);
      bm = Math.max(bm, m);
      cb = m;
      last = performance.now();
      sky(sc/(MAXP*.75));
      $("sc").textContent=sc;pp($("sc"));$("mx").textContent="×"+m;pp($("mx"));
      const c = document.createElement("span");
      c.className="ch l"+w.length;c.dataset.w=w;c.textContent=w+" +"+p;
      $("fd").prepend(c);fl("+"+p);
      if(m>=3)pp(c0,"bp");
      if(sData.isFever && !F.contains("fever")){F.add("fever");ban(c0,"FEVER","#ffe14d");}
      if(sData.isFullBurn){burst(c0,["#19f0ff","#ff2bd6","#ffe14d"],44);ban(c0,"FULL BURN","#ff2bd6");vib([40,40,120]);}else vib(20);
      used=[];draw();
      return;
    }
  }catch(e){}

  // Local fallback
  if(!ANS.includes(w)){shake(cw);pp(c0,"fr");brk();vib([60,40,60]);return}
  const nw=performance.now();cb=cb&&nw-last<5000?cb+1:1;last=nw;const m=Math.min(4,cb),p=PT[w.length]*m,c=document.createElement("span");bm=Math.max(bm,m);
  sc+=p;found.push(w);sky(sc/(MAXP*.75));$("sc").textContent=sc;pp($("sc"));$("mx").textContent="×"+m;pp($("mx"));c.className="ch l"+w.length;c.dataset.w=w;c.textContent=w+" +"+p;$("fd").prepend(c);fl("+"+p);if(m>=3)pp(c0,"bp");
  if(m==4&&!F.contains("fever")){F.add("fever");ban(c0,"FEVER","#ffe14d")}
  if(w.length==6){burst(c0,["#19f0ff","#ff2bd6","#ffe14d"],44);ban(c0,"FULL BURN","#ff2bd6");vib([40,40,120])}else vib(20);used=[];draw()
}

async function end(){
  clearInterval(iv);iv=0;F.remove("fever");
  try {
    const fRes = await fetch(`${API_BASE}/api/finish`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({session: sessionUUID, date: localDateStr})
    });
    if(fRes.ok){
      const fData = await fRes.json();
      if(fData.missedWords) serverMissedWords = fData.missedWords;
      if(fData.title) doneTitle = fData.title;
    }
  }catch(e){}
  if(!prac){done={sc,f:found,bm,missed:serverMissedWords};save(done)}
  fin({sc,f:found,bm,missed:serverMissedWords})
}

let doneTitle = "";
function fin(x){
  const pc=x.sc/(MAXP*1.5),ttl=doneTitle||(pc<.1?"Warm-up":pc<.25?"Wordsmith":pc<.45?"Lexicon Lord":pc<.7?"Dictionary Goblin":"Walking Thesaurus");
  const ms=(x.missed&&x.missed.length)?x.missed:ANS.filter(w=>!x.f.includes(w)).sort((a,b)=>b.length-a.length||a.localeCompare(b));
  const totCount = x.f.length + ms.length;
  const sh="Sprint #"+num+"  "+x.sc+" pts  x"+(x.bm||1)+" best combo  "+x.f.length+"/"+totCount+" words";
  $("hd").textContent="Time!";sky(Math.min(1,x.sc/(MAXP*.75)));
  $("v").innerHTML=`<div class="card"><p class="kick">Time! Letters: ${[...key].sort().join("").toUpperCase()}</p><div class="big">${x.sc}<small> PTS</small></div><h2>${ttl}</h2><p class="lede" style="margin:10px 0 14px">${x.f.length} of ${totCount} words · best combo ×${x.bm||1}</p>${ms.length?`<p class="kick">What you missed (${ms.length} words accounted for)</p><div>${ms.slice(0,36).map((w,i)=>`<span class="ch miss" style="--i:${i}">${w}</span>`).join("")}${ms.length>36?`<span class="ch miss">+${ms.length-36} more</span>`:""}</div>`:""}<div class="row"><button class="btn" id="cp">Copy result</button><button class="btn ghost" id="pr">Practice</button></div><p class="kick" id="cd" style="margin-top:16px"></p></div>`;

}

  done?fin(done):intro();
});
