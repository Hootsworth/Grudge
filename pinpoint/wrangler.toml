name = "pinpoint-backend"
main = "worker/index.ts"
compatibility_date = "2024-04-01"

# D1 Database binding for puzzles, rounds, sessions, guesses, and stats
[[d1_databases]]
binding = "DB"
database_name = "pinpoint-db"
database_id = "local-pinpoint-db-id"

# KV Namespace for pre-rendered local mystery window SVGs
[[kv_namespaces]]
binding = "KV"
id = "local-pinpoint-kv-id"
preview_id = "local-pinpoint-kv-preview-id"

[vars]
APPROVAL_SECRET = "pinpoint-admin-secret-key"
