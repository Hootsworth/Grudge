name = "passphew-backend"
main = "src/index.ts"
compatibility_date = "2024-04-05"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
CLAUDE_MODEL = "claude-sonnet-4-6"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "passphew-db"
database_id = "local-passphew-db-id"

# Cron Triggers:
# 04:00 UTC - Daily puzzle generation & solver verification pass
# 05:30 UTC - Approval deadline check & backlog fallback
[triggers]
crons = ["0 4 * * *", "30 5 * * *"]
