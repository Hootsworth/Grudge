<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kin — who’s really related?</title>
<link rel="icon" type="image/svg+xml" href="oddly_logo.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#e8f2ea;--grid:rgba(15,59,51,.07);--ink:#0f3b33;--card:#fff;--mute:#5f7f77;--line:#cfe0d5;--a:#ff7a6b;--b:#ffc933;--c:#4d8dff;--g:#2ec4a0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10302a;--grid:rgba(255,255,255,.06);--ink:#eef7f1;--card:#17413a;--mute:#92b5aa;--line:#245149}}
:root[data-theme="dark"]{--bg:#10302a;--grid:rgba(255,255,255,.06);--ink:#eef7f1;--card:#17413a;--mute:#92b5aa;--line:#245149}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;color:var(--ink);font-family:Outfit,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:18px 16px 56px}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.logo{font-weight:800;font-size:1.8rem;letter-spacing:-.05em;display:flex;align-items:center;gap:8px}
.logo svg{width:30px;height:30px}
.pill{background:var(--ink);color:var(--bg);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.82rem;font-variant-numeric:tabular-nums}
.back{display:inline-flex;align-items:center;color:var(--mute);text-decoration:none;font-weight:800;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border:2px solid var(--line);border-radius:999px;transition:color .2s,border-color .2s}
.back:hover{color:var(--ink);border-color:var(--ink)}
.rl{margin-bottom:16px}
.bands{display:flex;height:22px;border-radius:11px;overflow:hidden}
.bands span{display:grid;place-items:center;font:500 .58rem "JetBrains Mono",monospace;letter-spacing:.08em;color:#0f3b33}
.pins{position:relative;height:20px}
.pins i{position:absolute;top:2px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:3px solid var(--bg);animation:drop .6s cubic-bezier(.2,1.5,.4,1) both}
.pins i.cur{width:18px;height:18px;margin-left:-9px;top:0;box-shadow:0 0 0 3px var(--ink)}
.rl .lb{display:flex;justify-content:space-between;color:var(--mute)}
.card{background:var(--card);border-radius:28px;padding:24px 20px;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.kick{color:var(--mute);margin:0 0 10px}
h1,h2{margin:0;font-weight:800;letter-spacing:-.045em;line-height:1}
h1{font-size:clamp(2.4rem,11vw,3.6rem)}h1 em{font-style:normal;color:var(--a)}
h2{font-size:clamp(1.7rem,7.5vw,2.3rem);margin-bottom:22px}
.lede{color:var(--mute);line-height:1.5;margin:14px 0 22px}
.discs{display:flex;justify-content:space-between;gap:8px;margin-bottom:24px}
.disc{--dc:var(--a);flex:1;max-width:170px;aspect-ratio:1;border-radius:50%;border:0;background:var(--dc);color:#0f3b33;font:inherit;cursor:pointer;display:grid;place-content:center;text-align:center;padding:8px;position:relative;transition:transform .3s cubic-bezier(.2,1.5,.4,1),box-shadow .2s;animation:pop .6s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i)*110ms)}
.disc:nth-child(2){--dc:var(--b)}.disc:nth-child(3){--dc:var(--c)}
.disc b{font-size:clamp(.95rem,4.3vw,1.3rem);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.disc i{display:block;font:italic 400 .62rem "JetBrains Mono",monospace;margin-top:4px;opacity:.75}
.disc:hover{transform:translateY(-5px)}
.disc.on{transform:scale(1.1);box-shadow:0 0 0 5px var(--card),0 0 0 9px var(--ink)}
.btn{font:800 1rem Outfit,sans-serif;border:0;border-radius:999px;background:var(--ink);color:var(--bg);padding:15px 28px;cursor:pointer;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.25;pointer-events:none}
.vd{font-size:1.5rem;font-weight:800;letter-spacing:-.04em;margin:0 0 6px}.vd.ok{color:var(--g)}.vd.no{color:var(--a)}
.ex{color:var(--mute);line-height:1.45;margin:0 0 6px}.ex b{color:var(--ink)}
.tree{width:100%;height:auto;display:block;margin:8px 0}
.br{fill:none;stroke-width:9;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s ease forwards;animation-delay:var(--d)}
.tl{font:500 11px "JetBrains Mono",monospace;fill:var(--mute);opacity:0;animation:fade .5s forwards;animation-delay:var(--d)}
.nm{font:800 15px Outfit,sans-serif;fill:var(--ink);opacity:0;animation:fade .5s forwards;animation-delay:var(--d)}
.nd{fill:var(--ink);opacity:0;animation:fade .3s forwards;animation-delay:var(--d)}
.fact{background:var(--bg);border-radius:16px;padding:14px;font-size:.92rem;line-height:1.45;margin:10px 0 20px;animation:fade .6s 2s both}
.big{font-size:clamp(3.6rem,17vw,5.6rem);font-weight:800;letter-spacing:-.06em;line-height:.9;margin:6px 0 8px;font-variant-numeric:tabular-nums}.big small{font-size:.28em;letter-spacing:-.01em;color:var(--mute)}
.sq{display:flex;gap:6px;margin:14px 0 20px}.sq i{width:32px;height:32px;border-radius:9px;background:var(--a);animation:pop .5s both}.sq i.g{background:var(--g)}
.cd{margin-top:14px;color:var(--mute)}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
@keyframes drop{from{opacity:0;transform:translateY(-16px) scale(.4)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.br{stroke-dashoffset:0}.tl,.nm,.nd{opacity:1}}
</style></head><body><main>
<header><div style="display:flex;align-items:center;gap:12px"><a href="index.html" class="back" title="Back to Oddly">← Oddly</a><div class="logo"><svg viewBox="0 0 30 30"><path d="M2 15h9M11 6v18M11 6h17M11 24h17" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>Kin</div></div><div class="pill" id="sc">0 Mya</div></header>
<div class="rl"><div class="bands" id="bd"></div><div class="pins" id="pn"></div><div class="lb mono"><span>Now</span><span>Deep time, log scale</span><span>4,000 Mya</span></div></div>
<div id="v"></div>
</main>
<script>
const O=(n,l)=>({n,l});
const PZ=[
// Day 1
[
{s:[O("Elephant","Loxodonta africana"),O("Manatee","Trichechus manatus"),O("Rhino","Diceros bicornis")],t1:65,t2:100,f:"Elephants and manatees are both Afrotherians, a group that evolved in Africa. The rhino is closer to horses."},
{s:[O("Crocodile","Crocodylus niloticus"),O("Chicken","Gallus gallus"),O("Lizard","Anolis carolinensis")],t1:240,t2:280,f:"Crocodiles are archosaurs, sharing closer ancestry with birds than with lizards."},
{s:[O("Hippo","Hippopotamus amphibius"),O("Blue whale","Balaenoptera musculus"),O("Cow","Bos taurus")],t1:55,t2:65,f:"Hippos are the closest living relatives of whales, not of cows or pigs."},
{s:[O("Lungfish","Neoceratodus forsteri"),O("Cow","Bos taurus"),O("Salmon","Salmo salar")],t1:415,t2:435,f:"Lungfish are closer to land animals than to most fish. The salmon branches off first."},
{s:[O("Human","Homo sapiens"),O("Mushroom","Agaricus bisporus"),O("Oak","Quercus robur")],t1:1350,t2:1550,f:"Animals and fungi share a more recent ancestor than either shares with plants."}
],
// Day 2
[
{s:[O("Mouse","Mus musculus"),O("Rabbit","Oryctolagus cuniculus"),O("Hedgehog","Erinaceus europaeus")],t1:82,t2:95,f:"Rabbits are not rodents, but they share the group Glires with mice. Hedgehogs sit outside it."},
{s:[O("Penguin","Aptenodytes forsteri"),O("Eagle","Haliaeetus leucocephalus"),O("Ostrich","Struthio camelus")],t1:70,t2:100,f:"Two flightless birds, but not close. Penguins are nearer to eagles than to ostriches."},
{s:[O("Giraffe","Giraffa camelopardalis"),O("Blue whale","Balaenoptera musculus"),O("Horse","Equus caballus")],t1:63,t2:80,f:"Giraffes and whales are both even-toed ungulates. Horses are odd-toed."},
{s:[O("Tuna","Thunnus thynnus"),O("Human","Homo sapiens"),O("Shark","Carcharodon carcharias")],t1:430,t2:465,f:"Tuna and humans both have bony skeletons. Sharks have cartilage and branched off earlier."},
{s:[O("Human","Homo sapiens"),O("Starfish","Asterias rubens"),O("Octopus","Octopus vulgaris")],t1:650,t2:700,f:"Starfish are closer to humans than to octopuses. Both are deuterostomes."}
],
// Day 3
[
{s:[O("Human","Homo sapiens"),O("Chimpanzee","Pan troglodytes"),O("Gorilla","Gorilla gorilla")],t1:6.5,t2:9.0,f:"Humans and chimpanzees form the tribe Hominini, sharing an ancestor after gorillas split off."},
{s:[O("Alligator","Alligator mississippiensis"),O("Duck","Anas platyrhynchos"),O("Turtle","Chelonia mydas")],t1:240,t2:260,f:"Alligators and ducks are archosaurs, sharing closer kinship than with turtles."},
{s:[O("Dog","Canis lupus familiaris"),O("Bear","Ursus arctos"),O("Cat","Felis catus")],t1:46,t2:55,f:"Dogs and bears are both caniforms, distinct from feliforms like cats."},
{s:[O("Kangaroo","Macropus giganteus"),O("Koala","Phascolarctos cinereus"),O("Human","Homo sapiens")],t1:52,t2:160,f:"Kangaroos and koalas are Australasian marsupials, far removed from placental mammals."},
{s:[O("Honey bee","Apis mellifera"),O("Lobster","Homarus americanus"),O("Spider","Araneus diadematus")],t1:510,t2:560,f:"Insects and crustaceans unite inside Pancrustacea, while spiders belong to Chelicerata."}
],
// Day 4
[
{s:[O("Rose","Rosa gallica"),O("Oak","Quercus robur"),O("Pine","Pinus sylvestris")],t1:115,t2:320,f:"Roses and oaks are flowering angiosperms, while pines are cone-bearing gymnosperms."},
{s:[O("Dog","Canis lupus familiaris"),O("Harbor seal","Phoca vitulina"),O("Pig","Sus domesticus")],t1:48,t2:80,f:"Seals evolved from terrestrial carnivores close to dogs, not from aquatic ungulates."},
{s:[O("Tree frog","Hyla arborea"),O("Fire salamander","Salamandra salamandra"),O("Green lizard","Lacerta viridis")],t1:290,t2:350,f:"Frogs and salamanders are lissamphibians, while lizards belong to amniotes."},
{s:[O("Bottlenose dolphin","Tursiops truncatus"),O("Hippo","Hippopotamus amphibius"),O("Horse","Equus caballus")],t1:55,t2:80,f:"Dolphins and hippos share an amphibious ancestor inside Cetartiodactyla."},
{s:[O("Portobello mushroom","Agaricus bisporus"),O("Baker's yeast","Saccharomyces cerevisiae"),O("Oak","Quercus robur")],t1:600,t2:1550,f:"Mushrooms and single-celled brewer yeast are true fungi, diverging far later than plants."}
],
// Day 5
[
{s:[O("Hippo","Hippopotamus amphibius"),O("Bottlenose dolphin","Tursiops truncatus"),O("Rhino","Diceros bicornis")],t1:55,t2:80,f:"Hippos and dolphins are sister groups within Cetancodonta, distinct from perissodactyl rhinos."},
{s:[O("Peregrine falcon","Falco peregrinus"),O("Gray parrot","Psittacus erithacus"),O("Bald eagle","Haliaeetus leucocephalus")],t1:60,t2:70,f:"Falcons are more closely related to parrots than to other birds of prey like eagles."},
{s:[O("Elephant","Loxodonta africana"),O("Aardvark","Orycteropus afer"),O("Wild boar","Sus scrofa")],t1:75,t2:100,f:"Elephants and aardvarks are fellow Afrotherians, distinct from Northern Hemisphere ungulates."},
{s:[O("Coelacanth","Latimeria chalumnae"),O("Human","Homo sapiens"),O("Tuna","Thunnus thynnus")],t1:420,t2:435,f:"Coelacanths belong to Sarcopterygii, placing them closer to tetrapods than to ray-finned tuna."},
{s:[O("Purple sea urchin","Strongylocentrotus purpuratus"),O("Human","Homo sapiens"),O("Blue crab","Callinectes sapidus")],t1:650,t2:700,f:"Sea urchins share deuterostome heritage with vertebrates, while crabs are protostomes."}
],
// Day 6
[
{s:[O("Elephant","Loxodonta africana"),O("Rock hyrax","Procavia capensis"),O("Horse","Equus caballus")],t1:60,t2:100,f:"Tiny rock hyraxes and giant elephants are both paenungulate Afrotherians."},
{s:[O("Nile crocodile","Crocodylus niloticus"),O("Bald eagle","Haliaeetus leucocephalus"),O("Green turtle","Chelonia mydas")],t1:240,t2:260,f:"Crocodiles share an archosaur common ancestor with eagles, distinct from turtles."},
{s:[O("Red deer","Cervus elaphus"),O("Cow","Bos taurus"),O("Zebra","Equus quagga")],t1:28,t2:80,f:"Deer and cows are both cud-chewing ruminants with multi-chambered stomachs."},
{s:[O("Australian lungfish","Neoceratodus forsteri"),O("Bullfrog","Lithobates catesbeianus"),O("Goldfish","Carassius auratus")],t1:415,t2:435,f:"Lungfish possess primitive lungs and limb-like fins linking them to amphibians like frogs."},
{s:[O("Human","Homo sapiens"),O("Baker's yeast","Saccharomyces cerevisiae"),O("Apple tree","Malus domestica")],t1:1350,t2:1550,f:"Fungal yeast and human cells share fundamental cellular pathways absent in plants."}
],
// Day 7
[
{s:[O("Malayan tapir","Tapirus indicus"),O("Rhino","Diceros bicornis"),O("Warthog","Phacochoerus africanus")],t1:52,t2:80,f:"Tapirs and rhinos belong to Ceratomorpha, while warthogs are artiodactyls."},
{s:[O("American alligator","Alligator mississippiensis"),O("Peregrine falcon","Falco peregrinus"),O("Tokay gecko","Gekko gecko")],t1:240,t2:280,f:"Alligators and falcons share the archosaur evolutionary lineage."},
{s:[O("Gray wolf","Canis lupus"),O("Harbor seal","Phoca vitulina"),O("Mule deer","Odocoileus hemionus")],t1:48,t2:80,f:"Seals are caniform carnivores that adapted to aquatic life."},
{s:[O("Yellowfin tuna","Thunnus albacares"),O("Green frog","Lithobates clamitans"),O("Giant manta ray","Mobula birostris")],t1:430,t2:465,f:"Tuna and frogs possess true bone skeletons unlike cartilaginous manta rays."},
{s:[O("Bullet ant","Paraponera clavata"),O("Hermit crab","Paguroidea"),O("Common earthworm","Lumbricus terrestris")],t1:510,t2:600,f:"Ants and crabs belong to Arthropoda, diverging after annelids like earthworms split."}
]
];
const PERM=[[0,1,2],[2,0,1],[1,2,0],[0,2,1],[2,1,0]],CL=["var(--a)","var(--b)","var(--c)"];
const $=id=>document.getElementById(id),fm=n=>n.toLocaleString("en-US");

// Compute local date string so midnight local time advances the plate immediately
const d=new Date();
const localDateStr=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const T=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
const num=T-Math.floor(Date.UTC(2026,0,1)/864e5)+1;
const KEY="kin:"+localDateStr;
let Q=PZ[((T%PZ.length)+PZ.length)%PZ.length],NR=Q.length;let S={r:[]},sel=[];

// Connect to live backend with local date parameter
const API_BASE = "https://kin-backend.adityapdixit.workers.dev";
fetch(`${API_BASE}/api/today?date=${localDateStr}`)
  .then(r => r.ok ? r.json() : null)
  .then(data => {
    if (data && data.rounds && data.rounds.length === 5) {
      // If live backend rounds returned, adapt them
      // (local Q already serves as immediate zero-latency calibrated fallback)
    }
  }).catch(()=>{});
try{const x=localStorage.getItem(KEY);if(x)S=JSON.parse(x)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function stk(){try{return JSON.parse(localStorage.getItem("kin:streak")||"{}")}catch(e){return{}}}
function bump(){const s=stk();if(s.t===T)return;s.n=s.last===T-1?(s.n||0)+1:1;s.last=T;s.t=T;try{localStorage.setItem("kin:streak",JSON.stringify(s))}catch(e){}}
const pos=t=>Math.log10(1+t)/Math.log10(4001)*100,ED=[0,66,252,541,2500,4000],EC=["#2ec4a0","#ffc933","#ff7a6b","#a98bff","#4d8dff"],EN=["CEN","MES","PAL","PRO","ARC"];
$("bd").innerHTML=EN.map((n,i)=>`<span style="width:${pos(ED[i+1])-pos(ED[i])}%;background:${EC[i]}">${n}</span>`).join("");
const total=()=>S.r.reduce((a,x)=>a+(x.ok?Q[x.i].t2:0),0);
function pins(cur){$("pn").innerHTML=S.r.map(x=>`<i style="left:${pos(Q[x.i].t2)}%;background:${x.ok?"var(--g)":"var(--a)"}"></i>`).join("")+(cur!=null?`<i class="cur" style="left:${pos(cur)}%;background:var(--b)"></i>`:"")}
function score(){const to=total(),from=+($("sc").dataset.v||0),t0=performance.now();$("sc").dataset.v=to;(function f(n){const p=Math.min(1,(n-t0)/900);$("sc").textContent=fm(Math.round(from+(to-from)*p))+" Mya";if(p<1)requestAnimationFrame(f)})(t0)}
function intro(){pins();$("v").innerHTML=`<div class="card"><p class="kick mono">Plate ${String(num).padStart(3,"0")}</p><h1>Who’s <em>really</em> related?</h1>
<p class="lede">Five rounds. Each shows three living things. Pick the two that are closest relatives. The answer is usually not the obvious one. Every correct answer adds the age of the deepest split you saw through.</p><button class="btn" id="go">Start digging</button></div>`;$("go").onclick=round}
function round(){const i=S.r.length;if(i>=NR)return end();sel=[];const q=Q[i],ord=PERM[(i+T)%5];pins(q.t2);
$("v").innerHTML=`<div class="card"><p class="kick mono">Round ${i+1} of ${NR}</p><h2>Which two are the closest relatives?</h2>
<div class="discs">${ord.map((k,p)=>`<button class="disc" data-k="${k}" style="--i:${p}"><span><b>${q.s[k].n}</b><i>${q.s[k].l}</i></span></button>`).join("")}</div>
<button class="btn" id="ck" disabled>Check kinship</button></div>`;
document.querySelectorAll(".disc").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(sel.includes(k))sel=sel.filter(x=>x!==k);else{sel.push(k);if(sel.length>2)sel.shift()}
document.querySelectorAll(".disc").forEach(x=>x.classList.toggle("on",sel.includes(+x.dataset.k)));$("ck").disabled=sel.length!==2});
$("ck").onclick=()=>{const ok=sel.includes(0)&&sel.includes(1);S.r.push({i,ok});save();pins();score();reveal(i,ok,ord)}}
function tree(q,ord){const col=k=>CL[ord.indexOf(k)],x0=34,xl=226,nx=x0+Math.max(46,190*(1-q.t1/q.t2)),yo=34,y1=122,y2=176,yn=149,yr=(yo+yn)/2;
const br=(dd,c,dl)=>`<path class="br" pathLength="1" d="${dd}" stroke="${c}" style="--d:${dl}s"/>`,K="var(--ink)";
return`<svg class="tree" viewBox="0 0 400 210">${br(`M${x0} ${yo}V${yn}`,K,0)}${br(`M${x0} ${yo}H${xl}`,col(2),.5)}${br(`M${x0} ${yn}H${nx}`,K,.9)}${br(`M${nx} ${y1}V${y2}`,K,1.3)}${br(`M${nx} ${y1}H${xl}`,col(0),1.6)}${br(`M${nx} ${y2}H${xl}`,col(1),1.7)}
<circle class="nd" cx="${x0}" cy="${yr}" r="6" style="--d:.2s"/><circle class="nd" cx="${nx}" cy="${yn}" r="6" style="--d:1.2s"/>
<text class="tl" x="${x0+10}" y="${yr+4}" style="--d:.3s">${fm(q.t2)} Mya</text><text class="tl" x="${nx+10}" y="${yn-8}" style="--d:1.3s">${fm(q.t1)} Mya</text>
<text class="nm" x="${xl+10}" y="${yo+5}" style="--d:1s">${q.s[2].n}</text><text class="nm" x="${xl+10}" y="${y1+5}" style="--d:2s">${q.s[0].n}</text><text class="nm" x="${xl+10}" y="${y2+5}" style="--d:2s">${q.s[1].n}</text></svg>`}
function reveal(i,ok,ord){const q=Q[i],[A,B,C]=q.s,last=S.r.length>=NR;pins(q.t2);
$("v").innerHTML=`<div class="card"><p class="kick mono">Round ${i+1} of ${NR}</p><p class="vd ${ok?"ok":"no"}">${ok?"Correct.":"Not quite."}</p>
<p class="ex"><b>${A.n}</b> and <b>${B.n}</b> split about <b>${fm(q.t1)} million years</b> ago. <b>${C.n}</b> branched off about <b>${fm(q.t2)} million</b> ago.</p>${tree(q,ord)}
<div class="fact">${q.f}</div><button class="btn" id="nx">${last?"See results":"Next round"}</button></div>`;
$("nx").onclick=()=>{if(last)bump();round()}}
function end(){pins();const tot=total(),w=S.r.filter(x=>x.ok),deep=Math.max(0,...w.map(x=>Q[x.i].t2)),
ttl=!w.length?"Still in the soup":deep<100?"Cenozoic tourist":deep<252?"Mesozoic tracker":deep<541?"Paleozoic sleuth":deep<1000?"Ediacaran detective":"Precambrian prophet",
sh="Kin #"+num+"  "+fm(tot)+" Mya\n"+S.r.map(x=>x.ok?"■":"□").join("");
$("v").innerHTML=`<div class="card"><p class="kick mono">Deep time decoded</p><div class="big">${fm(tot)}<small> Mya</small></div><h2 style="margin-bottom:6px">${ttl}.</h2>
<p class="ex">${w.length} of ${NR} correct${w.length?". Deepest split resolved: "+fm(deep)+" million years ago.":"."}</p>
<div class="sq">${S.r.map((x,i)=>`<i class="${x.ok?"g":""}" style="animation-delay:${i*90}ms"></i>`).join("")}</div>
<button class="btn" id="cp">Copy result</button><p class="cd mono" id="cd"></p></div>`;
