name = "quipher-backend"
main = "src/index.ts"
compatibility_date = "2024-04-01"

# D1 Database binding for quotes, sessions, events, and daily_stats
[[d1_databases]]
binding = "DB"
database_name = "quipher-db"
database_id = "local-quipher-db-id"

[vars]
APPROVAL_SECRET = "quipher-admin-secret-key"

[triggers]
crons = ["0 4 * * *"]
