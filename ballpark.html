<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ballpark — close enough counts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{--bg:#efe8d8;--ink:#1c2a2b;--card:#fbf6e8;--mute:#7b7766;--line:#d9cfb6;--red:#e4452f;--teal:#1f7a72;--sun:#f0b429;--sky:#4d8dff;--ok:#2f9e6e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121c1c;--ink:#f1ead8;--card:#1b2a2a;--mute:#8fa09a;--line:#2b3d3c}}
:root[data-theme="dark"]{--bg:#121c1c;--ink:#f1ead8;--card:#1b2a2a;--mute:#8fa09a;--line:#2b3d3c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Sora,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
.mono{font-family:"Space Mono",ui-monospace,Menlo,monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.logo{font-weight:800;font-size:1.6rem;letter-spacing:-.05em;display:flex;align-items:center;gap:10px}
.logo svg{width:34px;height:20px}
.pill{background:var(--ink);color:var(--bg);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.82rem;font-variant-numeric:tabular-nums}
.back{display:inline-flex;align-items:center;color:var(--mute);text-decoration:none;font-weight:800;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border:2px solid var(--line);border-radius:999px;transition:color .2s,border-color .2s}
.back:hover{color:var(--ink);border-color:var(--ink)}
.card{background:var(--card);border-radius:28px;padding:24px 20px;border:3px solid var(--ink);animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.kick{color:var(--mute);margin:0 0 10px}
h1,h2{margin:0;font-weight:800;letter-spacing:-.045em;line-height:1.05}
h1{font-size:clamp(2.3rem,10.5vw,3.4rem)}h1 em{font-style:normal;color:var(--red)}
h2.q{font-size:clamp(1.45rem,6.2vw,1.95rem);margin-bottom:10px}
.unit{color:var(--teal);margin:0 0 18px}
.lede{color:var(--mute);line-height:1.55;margin:14px 0 22px}
.ro{text-align:center;margin:6px 0 14px}
.num{font-size:clamp(2.4rem,11vw,3.6rem);font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.sci{color:var(--mute);margin-top:4px}
.rule{position:relative;height:132px;margin:0 -4px;border-radius:16px;background:var(--bg);border:3px solid var(--ink);overflow:hidden;touch-action:none;cursor:ew-resize;user-select:none}
.rule svg{position:absolute;inset:0;width:100%;height:100%}
.cur{position:absolute;top:0;bottom:0;width:60px;margin-left:-30px;background:rgba(255,255,255,.28);border-left:2px solid var(--ink);border-right:2px solid var(--ink);z-index:3;transition:left .08s linear}
.cur::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--red)}
.cur::after{content:"";position:absolute;left:50%;top:-1px;width:16px;height:16px;margin-left:-8px;background:var(--red);clip-path:polygon(0 0,100% 0,50% 100%)}
.tf{position:absolute;top:0;bottom:0;width:0;z-index:2;display:none}
.tf::before{content:"";position:absolute;left:-1px;top:0;bottom:0;width:3px;background:var(--sun)}
.tf b{position:absolute;left:0;top:8px;transform:translateX(-50%);background:var(--sun);color:#1c2a2b;font:700 .62rem "Space Mono",monospace;letter-spacing:.1em;padding:3px 8px;border-radius:6px;white-space:nowrap}
.tf.show{display:block;animation:drop .7s cubic-bezier(.2,1.5,.4,1) both}
.br{position:absolute;top:58%;height:8px;background:var(--red);border-radius:4px;z-index:1;opacity:.8;transform-origin:left;animation:grow .6s .35s cubic-bezier(.2,.8,.2,1) both}
.st{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0 18px;color:var(--mute)}
.st button{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--card);color:var(--ink);font:800 1.3rem Sora,sans-serif;cursor:pointer}.st button:active{transform:scale(.92)}
.btn{width:100%;font:800 1.02rem Sora,sans-serif;border:0;border-radius:999px;background:var(--ink);color:var(--bg);padding:16px;cursor:pointer;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4;pointer-events:none}
.res{margin:16px 0 4px;animation:rise .5s both}
.res .v{font-size:1.9rem;font-weight:800;letter-spacing:-.05em;line-height:1}.res .v.g{color:var(--ok)}.res .v.b{color:var(--red)}
.res p{color:var(--mute);line-height:1.5;margin:8px 0 14px;font-size:.92rem}
.rw{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;font-weight:600;margin:4px 0}
.big{font-size:clamp(3.6rem,17vw,5.4rem);font-weight:800;letter-spacing:-.06em;line-height:.9;margin:6px 0 6px;font-variant-numeric:tabular-nums}.big small{font-size:.3em;color:var(--mute);letter-spacing:-.01em}
.lr{display:grid;grid-template-columns:1fr 84px auto;gap:10px;align-items:center;margin:9px 0;font-weight:600;font-size:.85rem}.lr span{height:12px;border-radius:6px;background:var(--line);overflow:hidden}.lr i{display:block;height:100%;background:var(--teal);border-radius:6px;animation:gw .9s cubic-bezier(.2,.8,.2,1) both}
.cd{margin-top:12px;color:var(--mute)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
@keyframes drop{from{opacity:0;transform:translateY(-40px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes gw{from{width:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main>
<header><div style="display:flex;align-items:center;gap:12px"><a href="index.html" class="back" title="Back to Oddly">← Oddly</a><div class="logo"><svg viewBox="0 0 34 20"><rect x="1.5" y="1.5" width="31" height="17" rx="4" fill="none" stroke="currentColor" stroke-width="3"/><path d="M9 1.5v7M17 1.5v5M25 1.5v7" stroke="currentColor" stroke-width="3"/><rect x="14" y="0" width="5" height="20" fill="var(--red)"/></svg>Ballpark</div></div><div class="pill" id="sc">0 pts</div></header>
<div id="v"></div>
</main>
<script>
const API_BASE = window.location.hostname.includes("workers.dev")
  ? ""
  : "https://ballpark-backend.adityapdixit.workers.dev";

const d0 = new Date();
const todayStr = `${d0.getFullYear()}-${String(d0.getMonth() + 1).padStart(2, '0')}-${String(d0.getDate()).padStart(2, '0')}`;
const T = Math.floor(Date.UTC(d0.getFullYear(), d0.getMonth(), d0.getDate()) / 864e5);
let num = Math.max(1, T - Math.floor(Date.UTC(2026, 0, 1) / 864e5) + 1);
const KEY = "ballpark:" + todayStr;

let sessionId = localStorage.getItem("ballpark:session_id:" + todayStr) || (() => {
  const id = (typeof crypto !== "undefined" && crypto.randomUUID)
    ? crypto.randomUUID()
    : "p_" + Math.random().toString(36).substring(2) + Date.now().toString(36);
  try { localStorage.setItem("ballpark:session_id:" + todayStr, id); } catch(e) {}
  return id;
})();

const U=[[1e24,"septillion"],[1e21,"sextillion"],[1e18,"quintillion"],[1e15,"quadrillion"],[1e12,"trillion"],[1e9,"billion"],[1e6,"million"],[1e3,"thousand"]];
const $=id=>document.getElementById(id);
function sig(n){if(n<=0)return 0;const f=Math.pow(10,Math.floor(Math.log10(n))-1);return Math.round(n/f)*f}
function fmt(v){const u=U.find(x=>v>=x[0]*.995);if(!u)return String(+sig(v).toFixed(1));return +(sig(v/u[0])).toFixed(1)+" "+u[1]}

let QUESTIONS = [];
let S = { r: [] };
let x = 9;
let ph = "g";
let drag = false;
let questionServeTime = Date.now();

try {
  const s = localStorage.getItem(KEY);
  if (s) S = JSON.parse(s);
} catch(e) {}

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const total = () => S.r.reduce((a, r) => a + (r.p || 0), 0);
const orders = () => S.r.reduce((a, r) => a + (r.err || 0), 0);

function pill() {
  const to = total(), from = +($("sc").dataset.v || 0), t0 = performance.now();
  $("sc").dataset.v = to;
  (function f(n) {
    const p = Math.min(1, (n - t0) / 800);
    $("sc").textContent = Math.round(from + (to - from) * p).toLocaleString("en-US") + " pts";
    if (p < 1) requestAnimationFrame(f);
  })(t0);
}

function scaleSVG() {
  let o = "";
  const L = ["1", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp"];
  for (let d = 0; d <= 24; d++) {
    const X = d / 24 * 1000;
    o += `<path d="M${X} 0V${d % 3 ? 34 : 52}" stroke="var(--ink)" stroke-width="${d % 3 ? 2 : 3}"/>`;
    if (d < 24) {
      for (let k = 2; k <= 9; k++) {
        const mx = (d + Math.log10(k)) / 24 * 1000;
        o += `<path d="M${mx.toFixed(1)} 0V${k === 5 ? 22 : 14}" stroke="var(--ink)" stroke-width="1.5" opacity=".6"/>`;
      }
    }
    if (d % 3 === 0) {
      o += `<text x="${Math.min(Math.max(X, 14), 986)}" y="76" text-anchor="middle" font-family="Space Mono,monospace" font-weight="700" font-size="17" fill="var(--ink)">${L[d / 3]}</text>`;
    }
  }
  return `<svg viewBox="0 0 1000 132" preserveAspectRatio="none" id="sv">${o}</svg>`;
}

function setX(v) {
  x = Math.min(24, Math.max(0, Math.round(v * 100) / 100));
  if ($("cur")) {
    $("cur").style.left = (x / 24 * 100) + "%";
    $("num").textContent = fmt(Math.pow(10, x));
    $("sci").textContent = "10^" + x.toFixed(1);
  }
}

function intro() {
  $("v").innerHTML = `<div class="card"><p class="kick mono">Ballpark #${String(num).padStart(3, "0")}</p><h1>Close enough <em>counts.</em></h1><p class="lede">Five absurd quantities. Slide the cursor to your best guess on a scale from one to a septillion. You’re scored on how many orders of magnitude you’re off. Being 10 times too high or too low still stings, but being right to within a factor of 2 earns almost full marks.</p><button class="btn" id="go">Start estimating</button></div>`;
  $("go").onclick = round;
}

function round() {
  const i = S.r.length;
  if (i >= 5 || i >= QUESTIONS.length) return end();
  ph = "g";
  x = 9;
  questionServeTime = Date.now();
  const q = QUESTIONS[i];

  $("v").innerHTML = `<div class="card"><p class="kick mono">Question ${i + 1} of 5</p><h2 class="q">${q.question}</h2><p class="unit mono">Answer in: ${q.unit}</p>
<div class="ro"><div class="num" id="num"></div><div class="sci mono" id="sci"></div></div>
<div class="rule" id="rule">${scaleSVG()}<div class="tf" id="tf"><b>TRUTH</b></div><div class="cur" id="cur"></div></div>
<div class="st mono"><button id="mn" aria-label="Lower">−</button>fine tune<button id="pl" aria-label="Higher">+</button></div><div id="ft"><button class="btn" id="lk">Lock it in</button></div></div>`;

  setX(x);
  const R = $("rule");
  const mv = e => {
    if (ph !== "g") return;
    const b = R.getBoundingClientRect();
    setX((e.clientX - b.left) / b.width * 24);
  };
  R.onpointerdown = e => { drag = true; R.setPointerCapture(e.pointerId); mv(e); };
  R.onpointermove = e => { if (drag) mv(e); };
  R.onpointerup = () => drag = false;

  $("mn").onclick = () => ph === "g" && setX(x - .1);
  $("pl").onclick = () => ph === "g" && setX(x + .1);
  $("lk").onclick = lockGuess;
}

async function lockGuess() {
  if (ph !== "g") return;
  const i = S.r.length;
  const q = QUESTIONS[i];
  const btn = $("lk");
  btn.disabled = true;
  btn.textContent = "Checking...";

  // Anti-cheat: Ensure at least 2.0s elapsed on client
  const elapsed = Date.now() - questionServeTime;
  if (elapsed < 2000) {
    await new Promise(r => setTimeout(r, 2000 - elapsed));
  }

  try {
    const res = await fetch(`${API_BASE}/api/guess`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session: sessionId, questionId: q.id, exponent: x, date: todayStr })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      if (err.error && err.error.includes("Out-of-order")) {
        sessionId = "p_" + Math.random().toString(36).substring(2) + Date.now().toString(36);
        try { localStorage.setItem("ballpark:session_id:" + todayStr, sessionId); } catch(e) {}
        return lock();
      }
      alert(err.error || "Failed to submit estimate.");
      btn.disabled = false;
      btn.textContent = "Lock it in";
      return;
    }

    const data = await res.json();
    ph = "r";
    S.r.push({ x, err: data.errorOrders, p: data.points, truth: data.truth, truthLog10: data.truthLog10, qId: q.id, u: q.unit });
    save();
    pill();
    reveal(q, data);
  } catch(e) {
    // Local fallback calculation if offline
    ph = "r";
    const t = 9.0;
    const err = Math.abs(x - t);
    const p = Math.round(1000 * Math.max(0, 1 - err / 2.5));
    S.r.push({ x, err, p, truth: Math.pow(10, t), truthLog10: t, qId: q.id, u: q.unit });
    save();
    pill();
    reveal(q, { truth: Math.pow(10, t), truthLog10: t, errorOrders: err, points: p, explanation: "Local estimate calculated." });
  }
}

function reveal(q, data) {
  const tf = $("tf"), R = $("rule");
  const t = data.truthLog10;
  const a = Math.min(x, t) / 24 * 100, w = Math.abs(x - t) / 24 * 100;
  tf.style.left = (t / 24 * 100) + "%";
  tf.classList.add("show");

  if (w > 0.3) {
    const b = document.createElement("div");
    b.className = "br";
    b.style.left = a + "%";
    b.style.width = w + "%";
    R.appendChild(b);
  }

  const g = Math.pow(10, x), r = g / data.truth, fac = r >= 1 ? r : 1 / r;
  const last = S.r.length >= 5;
  const spot = data.errorOrders < 0.15;
  const txt = spot ? "Spot on." : "Off by ×" + (fac >= 100 ? Math.round(fac).toLocaleString("en-US") : fac.toFixed(1)) + (r >= 1 ? " too high" : " too low");

  $("num").textContent = fmt(data.truth);
  $("sci").textContent = "The truth (10^" + data.truthLog10.toFixed(1) + ")";
  const stElem = document.querySelector(".st");
  if (stElem) stElem.style.display = "none";

  const medianHtml = data.medianGuess !== null && data.medianGuess !== undefined
    ? `<div class="rw"><span class="mono" style="color:var(--mute)">Crowd median</span><span>10^${data.medianGuess}</span></div>`
    : "";

  $("ft").innerHTML = `<div class="res"><div class="v ${data.errorOrders < 0.5 ? "g" : "b"}">${txt}</div><p>${data.explanation}</p><div class="rw"><span class="mono" style="color:var(--mute)">You said</span><span>${fmt(g)} (10^${x.toFixed(1)})</span></div>${medianHtml}<div class="rw"><span class="mono" style="color:var(--mute)">Points</span><span>+${data.points} of 1,000</span></div><button class="btn" id="nx" style="margin-top:14px">${last ? "See results" : "Next question"}</button></div>`;
  $("nx").onclick = round;
}

async function end() {
  const t = total(), o = orders();
  let ttl = o < 0.5 ? "Human calculator" : o < 1.5 ? "Fermi’s apprentice" : o < 3.0 ? "Napkin mathematician" : o < 6.0 ? "Vibes-based estimator" : "Order of magnitude? Never heard of her";
  let percentileStr = "";

  try {
    const res = await fetch(`${API_BASE}/api/finish`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session: sessionId })
    });
    if (res.ok) {
      const data = await res.json();
      if (data.rank) ttl = data.rank;
      if (typeof data.percentile === "number") {
        percentileStr = ` · Top ${Math.max(1, 100 - data.percentile)}% today`;
      }
    }
  } catch(e) {}

  const sh = "Ballpark #" + num + "  " + t.toLocaleString("en-US") + " / 5,000  (off by " + o.toFixed(1) + " orders)\n" + S.r.map(r => r.err < 0.3 ? "■" : r.err < 1 ? "▲" : "□").join("");
  $("v").innerHTML = `<div class="card"><p class="kick mono">Final score</p><div class="big" id="bg">${t.toLocaleString("en-US")}<small> / 5,000</small></div><h2 style="font-size:1.4rem;margin:4px 0 6px">${ttl}.${percentileStr ? `<span style="font-size:0.85rem;font-weight:600;color:var(--mute);display:block;margin-top:4px">${percentileStr}</span>` : ""}</h2><p class="lede" style="margin:0 0 14px">In total you were off by <b style="color:var(--ink)">${o.toFixed(1)} orders of magnitude</b>.</p>
${S.r.map((r, i) => `<div class="lr"><b>${r.u || (QUESTIONS[i] && QUESTIONS[i].unit) || "Q" + (i + 1)}</b><span><i style="width:${(r.p || 0) / 10}%"></i></span><b>${r.p || 0}</b></div>`).join("")}
<button class="btn" id="cp" style="margin-top:16px">Copy result</button><p class="cd mono" id="cd"></p></div>`;

  $("cp").onclick = () => {
    try {
      navigator.clipboard.writeText(sh).then(() => $("cp").textContent = "Copied", () => prompt("Copy:", sh));
    } catch(e) {
      prompt("Copy:", sh);
    }
  };

  const tick = () => {
    const a = new Date(), r = new Date(a.getFullYear(), a.getMonth(), a.getDate() + 1) - a, q = y => String(y).padStart(2, "0");
    const cd = $("cd");
    if (cd) cd.textContent = "Next ballpark in " + q(Math.floor(r / 36e5)) + ":" + q(Math.floor(r / 6e4) % 60) + ":" + q(Math.floor(r / 1e3) % 60);
  };
  tick();
  setInterval(tick, 1000);
}

document.addEventListener("keydown", e => {
  if (ph !== "g" || !$("cur")) return;
  if (e.key === "ArrowLeft") { setX(x - .05); e.preventDefault(); }
  if (e.key === "ArrowRight") { setX(x + .05); e.preventDefault(); }
  if (e.key === "Enter") $("lk") && $("lk").click();
});

// Load today's questions from Worker API
fetch(`${API_BASE}/api/today?session=${sessionId}&date=${todayStr}`)
  .then(r => r.ok ? r.json() : null)
  .then(data => {
    if (data && data.questions && data.questions.length >= 5) {
      QUESTIONS = data.questions;
      if (data.plate) num = data.plate;
    }
  })
  .catch(() => {})
  .finally(() => {
    if (!QUESTIONS || QUESTIONS.length < 5) {
      fetch("ballpark_today.json")
        .then(r => r.ok ? r.json() : null)
        .then(fallback => {
          if (fallback && fallback.questions) {
            QUESTIONS = fallback.questions;
            if (fallback.plate) num = fallback.plate;
          }
        })
        .catch(() => {})
        .finally(() => {
          pill();
          S.r.length ? (S.r.length >= 5 ? end() : round()) : intro();
        });
    } else {
      pill();
      S.r.length ? (S.r.length >= 5 ? end() : round()) : intro();
    }
  });
</script></body></html>
