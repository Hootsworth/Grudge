name = "strata-backend"
main = "src/index.ts"
compatibility_date = "2024-04-05"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
# Search provider for Anthropic verification (optional)
SEARCH_PROVIDER = "tavily"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "strata-db"
database_id = "local-strata-db-id"

# Cron Triggers:
# 05:00 UTC - Daily puzzle generation & verification pass
# 06:00 UTC - Auto-publish check & backlog fallback
[triggers]
crons = ["0 5 * * *", "0 6 * * *"]
