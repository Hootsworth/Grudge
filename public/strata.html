<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strata — dig history into order</title>
<link rel="icon" type="image/svg+xml" href="oddly_logo.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f1e6d0;--ink:#2a1d14;--mute:#8a7660;--line:#d9c9a8;--panel:#e8d9b8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17110d;--ink:#f4e7d0;--mute:#9b8870;--line:#33271e;--panel:#221a14}}
:root[data-theme="dark"]{--bg:#17110d;--ink:#f4e7d0;--mute:#9b8870;--line:#33271e;--panel:#221a14}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Syne,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:18px 16px 56px}
.mono{font-family:"DM Mono",ui-monospace,Menlo,monospace;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.logo{font-weight:800;font-size:1.7rem;letter-spacing:-.04em;display:flex;align-items:center;gap:10px}
.logo i{display:flex;flex-direction:column;gap:2px}.logo i b{display:block;height:5px;border-radius:2px;width:22px}
.logo i b:nth-child(1){background:#6bbf59}.logo i b:nth-child(2){background:#e8a94a}.logo i b:nth-child(3){background:#c4603f}.logo i b:nth-child(4){background:#7a5a8c}
.digs-counter{display:flex;gap:8px;align-items:center;color:var(--mute);font-family:"DM Mono",ui-monospace,Menlo,monospace;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
.pips{display:flex;gap:6px;align-items:center}
.pips span{width:12px;height:12px;border-radius:50%;border:2px solid var(--mute);transition:background .3s;box-sizing:border-box;display:inline-block;flex-shrink:0}
.pips span.u{background:var(--ink);border-color:var(--ink)}
.back{display:inline-flex;align-items:center;color:var(--mute);text-decoration:none;font-weight:800;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border:2px solid var(--line);border-radius:999px;transition:color .2s,border-color .2s}
.back:hover{color:var(--ink);border-color:var(--ink)}
h1{font-size:clamp(1.9rem,8vw,2.6rem);letter-spacing:-.045em;line-height:1;margin:0 0 8px;font-weight:800;animation:rise .7s both}
.sub{color:var(--mute);margin:0 0 20px;font-family:"DM Mono",monospace;font-size:.82rem;line-height:1.5}
.lab{display:flex;justify-content:space-between;color:var(--mute);margin:0 4px 6px}
.surf{height:12px;background:#6bbf59;border-radius:6px 6px 0 0;margin-bottom:6px}
.bed{height:16px;margin-top:6px;border-radius:0 0 8px 8px;background:repeating-linear-gradient(90deg,var(--ink) 0 14px,var(--mute) 14px 22px);opacity:.55}
#list{position:relative}
.card{position:absolute;left:0;right:0;height:68px;transition:transform .32s cubic-bezier(.2,.8,.2,1);animation:fade .5s both;animation-delay:calc(var(--i)*70ms)}
.card.drag{transition:none;z-index:5;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.c{height:100%;display:flex;align-items:center;gap:12px;padding:0 20px 0 12px;background:var(--bc);color:#1c130d;position:relative}
.grip{flex:none;width:30px;height:38px;display:grid;place-items:center;cursor:grab;touch-action:none;border-radius:8px;outline-offset:2px}
.grip:active{cursor:grabbing}
.grip::before{content:"";width:12px;height:22px;background:radial-gradient(circle,#1c130d 2px,transparent 2.6px) 0 0/6px 7px;opacity:.75}
.t{flex:1;font-weight:600;font-size:.98rem;line-height:1.2;letter-spacing:-.01em}
.yr{display:none;font:500 .82rem "DM Mono",monospace;white-space:nowrap}
.tg{display:none;font:500 .62rem "DM Mono",monospace;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.lock .grip{display:none}.lock .tg{display:block}.lock .c::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(0,0,0,.09) 0 6px,transparent 6px 12px);pointer-events:none}
.rev .yr{display:block}.rev .tg{display:none}
.ok .c{animation:ok .6s}.no .c{animation:no .6s}
.row{display:flex;gap:12px;align-items:center;margin-top:22px}
.btn{font:800 1rem Syne,sans-serif;border:0;border-radius:999px;background:var(--ink);color:var(--bg);padding:15px 28px;cursor:pointer;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.25;pointer-events:none}
.say{flex:1;font-family:"DM Mono",monospace;font-size:.82rem;line-height:1.4;color:var(--mute);animation:fade .4s both}
.end{background:var(--panel);border-radius:22px;padding:22px;margin-top:24px;animation:rise .7s both}
.big{font-size:clamp(3rem,14vw,4.6rem);font-weight:800;letter-spacing:-.06em;line-height:.95;margin:6px 0 10px}
.stat{font-family:"DM Mono",monospace;font-size:.84rem;line-height:1.6;color:var(--mute);margin:0 0 16px}.stat b{color:var(--ink);font-weight:500}
.sq{display:grid;gap:5px;margin:0 0 18px}.sq div{display:flex;gap:5px}.sq i{width:26px;height:26px;border-radius:5px;background:var(--line);display:block}.sq i.g{background:#6bbf59}
.cd{margin-top:14px;color:var(--mute)}
@keyframes rise{from{opacity:0;transform:translateY(20px)}}
@keyframes fade{from{opacity:0}}
@keyframes ok{40%{transform:scale(1.035)}}
@keyframes no{20%{transform:translateX(-9px) rotate(-1.4deg)}45%{transform:translateX(9px) rotate(1.4deg)}70%{transform:translateX(-5px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main>
<header><div style="display:flex;align-items:center;gap:12px"><a href="index.html" class="back" title="Back to Oddly">← Oddly</a><div class="logo"><i><b></b><b></b><b></b><b></b></i>Strata</div></div><div class="digs-counter"><span id="al">Digs</span><div class="pips"><span id="p0"></span><span id="p1"></span><span id="p2"></span><span id="p3"></span></div></div></header>
<h1>Stack history in order.</h1>
<p class="sub">Drag the grip. Newest on the surface, oldest on the bedrock. Correct layers lock in place after each dig.</p>
<div class="lab mono"><span>Surface · newest</span><span id="n"></span></div>
<div class="surf"></div><div id="list"></div><div class="bed"></div>
<div class="lab mono" style="margin-top:6px"><span>Bedrock · oldest</span></div>
<div class="row" id="ctl"><button class="btn" id="lk">Dig</button><div class="say" id="say">Six layers. Four digs. Go.</div></div>
<div id="end"></div>
</main>
<script>
const STRATA_BACKLOG = [{"plate":"The Quantum Century","events":[{"t":"Hubble discovers galaxies beyond the Milky Way","y":1924,"ap":0},{"t":"Penicillin is discovered in Alexander Fleming’s lab","y":1928,"ap":0},{"t":"Watson and Crick determine DNA double helix structure","y":1953,"ap":0},{"t":"Cosmic microwave background radiation detected","y":1964,"ap":0},{"t":"The first cloned mammal Dolly the sheep is born","y":1996,"ap":0},{"t":"Planck introduces quantum theory of black-body radiation","y":1900,"ap":0}]},{"plate":"Across Oceans & Orbits","events":[{"t":"Phoenician circumnavigation of Africa under Necho II","y":-600,"ap":1},{"t":"Vikings establish settlement at L’Anse aux Meadows","y":1000,"ap":1},{"t":"Magellan’s expedition completes global circumnavigation","y":1522,"ap":0},{"t":"Amundsen leads expedition reaching the South Pole","y":1911,"ap":0},{"t":"Yuri Gagarin completes orbital flight around Earth","y":1961,"ap":0},{"t":"Voyager 1 enters interstellar space","y":2012,"ap":0}]},{"plate":"Renaissance to Modernity","events":[{"t":"Gutenberg press produces copies of the Latin Bible","y":1455,"ap":0},{"t":"Shakespeare’s Globe Theatre opens in London","y":1599,"ap":0},{"t":"Diderot and d’Alembert publish the Encyclopedie","y":1751,"ap":0},{"t":"Beethoven conducts premiere of the Ninth Symphony","y":1824,"ap":0},{"t":"The Eiffel Tower opens for the Paris Exposition","y":1889,"ap":0},{"t":"The Louvre Museum officially opens to the public","y":1793,"ap":0}]},{"plate":"Silicon & Microchips","events":[{"t":"Wright brothers conduct sustained powered airplane flight","y":1903,"ap":0},{"t":"Bell Labs engineers invent the point-contact transistor","y":1947,"ap":0},{"t":"First message transmitted over ARPANET network","y":1969,"ap":0},{"t":"Intel releases the commercial 4004 microprocessor","y":1971,"ap":0},{"t":"Tim Berners-Lee publishes proposal for the World Wide Web","y":1989,"ap":0},{"t":"Edison demonstrates commercial incandescent electric lamp","y":1879,"ap":0}]},{"plate":"The Olympic Revival","events":[{"t":"First modern Olympic Games held in Athens","y":1896,"ap":0},{"t":"Tour de France bicycle race stages inaugural edition","y":1903,"ap":0},{"t":"Inaugural FIFA World Cup tournament held in Uruguay","y":1930,"ap":0},{"t":"Roger Bannister breaks the four-minute mile barrier","y":1954,"ap":0},{"t":"Pele wins three World Cup titles with Brazil","y":1970,"ap":0},{"t":"Miracle on Ice hockey match at Lake Placid","y":1980,"ap":0}]},{"plate":"Crowns to Republics","events":[{"t":"Peace of Westphalia ends the Thirty Years’ War","y":1648,"ap":0},{"t":"English Parliament passes the Bill of Rights","y":1689,"ap":0},{"t":"Continental Congress adopts Declaration of Independence","y":1776,"ap":0},{"t":"Storming of the Bastille sparks revolutionary change","y":1789,"ap":0},{"t":"Congress of Vienna establishes European borders","y":1815,"ap":0},{"t":"United Nations Charter signed in San Francisco","y":1945,"ap":0}]},{"plate":"Dawn of Civilization","events":[{"t":"Construction of the Great Pyramid of Giza finishes","y":-2560,"ap":1},{"t":"Babylonian king Hammurabi codifies laws on stone stele","y":-1750,"ap":1},{"t":"Inaugural ancient Olympic festival recorded at Olympia","y":-776,"ap":1},{"t":"Construction begins on the Parthenon in Athens","y":-447,"ap":0},{"t":"Julius Caesar assassinated on the Ides of March","y":-44,"ap":0},{"t":"Fall of the Western Roman Empire with Romulus Augustulus","y":476,"ap":0}]},{"plate":"From Stars to Atoms","events":[{"t":"Aristotle writes natural philosophy treatise Physics","y":-330,"ap":1},{"t":"Archimedes formulates law of buoyancy in Syracuse","y":-250,"ap":1},{"t":"Copernicus publishes heliocentric astronomical model","y":1543,"ap":0},{"t":"Newton publishes mathematical principles of gravity","y":1687,"ap":0},{"t":"Darwin publishes theory of evolution in Origin of Species","y":1859,"ap":0},{"t":"Einstein publishes theory of General Relativity","y":1915,"ap":0}]},{"plate":"The Polar & Space Race","events":[{"t":"Nansen’s ship Fram reaches far northern Arctic waters","y":1895,"ap":0},{"t":"Robert Peary expedition claims reaching North Pole","y":1909,"ap":0},{"t":"Charles Lindbergh flies solo across Atlantic Ocean","y":1927,"ap":0},{"t":"Edmund Hillary and Tenzing Norgay summit Mount Everest","y":1953,"ap":0},{"t":"Bathyscaphe Trieste dives to Challenger Deep ocean floor","y":1960,"ap":0},{"t":"Apollo 11 mission lands astronauts on the lunar surface","y":1969,"ap":0}]},{"plate":"Modernist Shocks","events":[{"t":"Van Gogh paints The Starry Night at Saint-Remy","y":1889,"ap":0},{"t":"Picasso paints proto-Cubist canvas Les Demoiselles d’Avignon","y":1907,"ap":0},{"t":"Stravinsky’s Rite of Spring ballet causes Paris riot","y":1913,"ap":0},{"t":"James Joyce publishes modernist novel Ulysses in Paris","y":1922,"ap":0},{"t":"George Orwell publishes dystopian novel Nineteen Eighty-Four","y":1949,"ap":0},{"t":"Beatles hold final public concert on Abbey Road rooftop","y":1969,"ap":0}]},{"plate":"Steam to Electricity","events":[{"t":"Newcomen constructs atmospheric steam engine for mines","y":1712,"ap":0},{"t":"James Watt patents condenser improving steam efficiency","y":1769,"ap":0},{"t":"Alessandro Volta invents the electrochemical electric battery","y":1800,"ap":0},{"t":"Morse and Vail demonstrate the electromagnetic telegraph","y":1844,"ap":0},{"t":"Alexander Graham Bell patents the speaking telephone","y":1876,"ap":0},{"t":"Guglielmo Marconi sends transatlantic wireless radio signal","y":1901,"ap":0}]},{"plate":"Cold War & Treaties","events":[{"t":"Treaty of Versailles ends World War I fighting","y":1919,"ap":0},{"t":"Twelve Western nations sign North Atlantic Treaty (NATO)","y":1949,"ap":0},{"t":"East Germany erects concrete wall dividing Berlin","y":1961,"ap":0},{"t":"Peace accords signed ending American role in Vietnam","y":1973,"ap":0},{"t":"Berlin Wall opened as crowds celebrate across border","y":1989,"ap":0},{"t":"Maastricht Treaty formally establishes European Union","y":1993,"ap":0}]},{"plate":"Iron & Classical Age","events":[{"t":"Late Bronze Age collapse strikes eastern Mediterranean kingdoms","y":-1177,"ap":1},{"t":"Assyrian king Ashurbanipal establishes royal library at Nineveh","y":-650,"ap":1},{"t":"Cyrus the Great issues declaration freeing Babylonian captives","y":-539,"ap":0},{"t":"Battle of Marathon repels Persian invasion forces","y":-490,"ap":0},{"t":"Alexander the Great defeats Persian forces at Gaugamela","y":-331,"ap":0},{"t":"Qin Shi Huang unifies warring states and founds Qin dynasty","y":-221,"ap":0}]},{"plate":"Pioneering Games","events":[{"t":"America wins inaugural yacht race around Isle of Wight","y":1851,"ap":0},{"t":"England and Scotland play first official international soccer match","y":1872,"ap":0},{"t":"Inaugural Wimbledon lawn tennis championships staged","y":1877,"ap":0},{"t":"First running of the modern Boston Marathon","y":1897,"ap":0},{"t":"Inaugural Indianapolis 500 automobile race takes place","y":1911,"ap":0},{"t":"Jesse Owens wins four gold medals at Berlin stadium","y":1936,"ap":0}]}];
const COL=["#e07a4f","#f0b84a","#d9c48f","#94a84f","#4b8f93","#b783b3"],
CP=["polygon(0 10%,14% 0,34% 8%,58% 0,80% 9%,100% 0,100% 90%,86% 100%,62% 91%,40% 100%,16% 92%,0 100%)","polygon(0 0,18% 9%,40% 0,64% 8%,84% 0,100% 9%,100% 100%,82% 91%,58% 100%,36% 92%,14% 100%,0 91%)","polygon(0 6%,22% 0,46% 9%,70% 0,100% 8%,100% 94%,78% 100%,52% 92%,28% 100%,0 93%)","polygon(0 0,26% 8%,50% 0,76% 9%,100% 0,100% 100%,74% 92%,48% 100%,24% 91%,0 100%)"];
const $=id=>document.getElementById(id),H=68,STEP=62,N=6,MAXA=4;

// Compute local date string so midnight local time advances the plate immediately
const d=new Date();
const localDateStr=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const T=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
const num=T-Math.floor(Date.UTC(2026,0,1)/864e5)+1;
const KEY="strata:"+localDateStr;

const dayTemplate = STRATA_BACKLOG[((T % STRATA_BACKLOG.length) + STRATA_BACKLOG.length) % STRATA_BACKLOG.length];
const EV = dayTemplate.events.map((e, i) => ({ ...e, id: i }));
const truth = EV.slice().sort((a, b) => b.y - a.y).map(e => e.id);
const fmt=e=>(e.ap?"c. ":"")+(e.y<0?(-e.y)+" BCE":e.y);
let s=T*2654435761%2147483647||7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
let ord0=EV.map(e=>e.id);for(let i=N-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[ord0[i],ord0[j]]=[ord0[j],ord0[i]]}
if(ord0.every((x,i)=>x===truth[i]))[ord0[0],ord0[1]]=[ord0[1],ord0[0]];
let S={ord:ord0,locked:[],att:0,hist:[],over:null};
const validOrd = a => Array.isArray(a) && a.length === N && a.every(x => typeof x === "number" && x >= 0 && x < N) && new Set(a).size === N;
try{
  const x=localStorage.getItem(KEY);
  if(x){
    const p=JSON.parse(x);
    if(p && validOrd(p.ord)){
      S=p;
      if(!Array.isArray(S.locked)) S.locked=[];
      if(!Array.isArray(S.hist)) S.hist=[];
      S.locked=S.locked.filter(id=>typeof id==="number"&&id>=0&&id<N);
    }
  }
}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const list=$("list");list.style.height=((N-1)*STEP+H)+"px";
const el={};
EV.forEach((e,k)=>{const c=document.createElement("div");c.className="card";c.style.setProperty("--i",k);
c.innerHTML=`<div class="c" style="--bc:${COL[e.id]};clip-path:${CP[e.id%4]}"><span class="grip" tabindex="0" role="button" aria-label="Reorder: ${e.t}"></span><span class="t">${e.t}</span><span class="tg">Set</span><b class="yr">${fmt(e)}</b></div>`;
list.appendChild(c);el[e.id]=c});
function place(skip){S.ord.forEach((id,i)=>{if(id!==skip && el[id])el[id].style.transform=`translateY(${i*STEP}px)`})}
function reorder(id,p){const L=S.ord.map(x=>S.locked.includes(x)?x:null),unl=S.ord.filter(x=>!S.locked.includes(x));
const cur=unl.indexOf(id);if(p<0||p>=unl.length||p===cur)return false;unl.splice(cur,1);unl.splice(p,0,id);let k=0;S.ord=L.map(x=>x!==null?x:unl[k++]);return true}
let dr=null;
list.addEventListener("pointerdown",e=>{const g=e.target.closest(".grip");if(!g||S.over)return;const c=g.closest(".card"),id=+Object.keys(el).find(k=>el[k]===c);if(S.locked.includes(id))return;
dr={id,c,sy:e.clientY,b:S.ord.indexOf(id)*STEP};c.classList.add("drag");g.setPointerCapture(e.pointerId);e.preventDefault()});
list.addEventListener("pointermove",e=>{if(!dr)return;const y=Math.max(0,Math.min((N-1)*STEP,dr.b+e.clientY-dr.sy));dr.c.style.transform=`translateY(${y}px)`;
const slots=S.ord.map((x,i)=>S.locked.includes(x)?-1:i).filter(i=>i>=0);let best=0,bd=1e9;slots.forEach((sl,j)=>{const dd=Math.abs(sl*STEP-y);if(dd<bd){bd=dd;best=j}});
if(reorder(dr.id,best))place(dr.id)});
const up=()=>{if(!dr)return;dr.c.classList.remove("drag");dr=null;place();save()};
list.addEventListener("pointerup",up);list.addEventListener("pointercancel",up);
list.addEventListener("keydown",e=>{const g=e.target.closest(".grip");if(!g||S.over||!/^Arrow(Up|Down)$/.test(e.key))return;const c=g.closest(".card"),id=+Object.keys(el).find(k=>el[k]===c);if(S.locked.includes(id))return;
const unl=S.ord.filter(x=>!S.locked.includes(x));if(reorder(id,unl.indexOf(id)+(e.key==="ArrowUp"?-1:1))){place();save()}e.preventDefault()});
const SN=["Zero. Truly a bold strategy.","One in place. The rest are tourists.","Two. The timeline is weeping.","Half right. Half is a lot of wrong.","Four. So close it hurts.","Five. One swap from glory."];
function ui(){for(let i=0;i<MAXA;i++)$("p"+i).className=i<S.att?"u":"";
EV.forEach(e=>{if(el[e.id]){el[e.id].classList.toggle("lock",S.locked.includes(e.id));el[e.id].classList.toggle("rev",!!S.over)}});place();
$("lk").disabled=!!S.over;$("ctl").style.display=S.over?"none":"flex";$("n").textContent=S.over?"":(MAXA-S.att)+" digs left";if(S.over)finish()}
$("lk").onclick=()=>{if(S.over)return;const row=S.ord.map((id,i)=>id===truth[i]);S.hist.push(row);S.att++;const n=row.filter(Boolean).length;
S.ord.forEach((id,i)=>{const c=el[id];if(!c)return;c.classList.remove("ok","no");void c.offsetWidth;if(row[i]){if(!S.locked.includes(id))S.locked.push(id);c.classList.add("ok")}else c.classList.add("no")});
if(n===N)S.over="win";else if(S.att>=MAXA){S.over="lose";S.ord=truth.slice()}
$("say").textContent=S.over==="win"?"Fine. Correct. History is in order.":S.over==="lose"?"Out of digs. The earth keeps its secrets.":SN[n];
save();ui()};
function finish(){const ys=EV.map(e=>e.y).sort((a,b)=>a-b),adj=ys[0]<0&&ys[N-1]>0?-1:0,span=ys[N-1]-ys[0]+adj;
let gi=1,gm=ys[1]-ys[0]+(ys[0]<0&&ys[1]>0?-1:0);for(let i=2;i<N;i++){const g=ys[i]-ys[i-1]+(ys[i-1]<0&&ys[i]>0?-1:0);if(g>gm){gm=g;gi=i}}
const A=EV.find(e=>e.y===ys[gi-1])||EV[0],B=EV.find(e=>e.y===ys[gi])||EV[1],w=S.over==="win",
ttl=!w?"Buried alive":["Time lord","Historian","Archivist","Dug it up"][S.att-1],
sh="Strata #"+num+"  "+(w?S.att:"X")+"/"+MAXA+"\n"+S.hist.map(r=>r.map(x=>x?"■":"□").join("")).join("\n");
$("end").innerHTML=`<div class="end"><p class="mono" style="margin:0;color:var(--mute)">${w?"Solved in "+S.att+(S.att===1?" dig":" digs"):"Not this time"}</p><div class="big">${ttl}.</div>
<p class="stat">This stack spans <b>${span.toLocaleString()} years</b>.<br>Biggest jump: <b>${gm.toLocaleString()} years</b> between “${A.t}” and “${B.t}”.</p>
<div class="sq">${S.hist.map(r=>`<div>${r.map(x=>`<i class="${x?"g":""}"></i>`).join("")}</div>`).join("")}</div>
<button class="btn" id="cp">Copy result</button><p class="cd mono" id="cd"></p></div>`;
$("cp").onclick=()=>{try{navigator.clipboard.writeText(sh).then(()=>$("cp").textContent="Copied",()=>prompt("Copy:",sh))}catch(e){prompt("Copy:",sh)}};
const tick=()=>{const a=new Date(),r=new Date(a.getFullYear(),a.getMonth(),a.getDate()+1)-a,q=x=>String(x).padStart(2,"0");$("cd").textContent="Next dig in "+q(Math.floor(r/36e5))+":"+q(Math.floor(r/6e4)%60)+":"+q(Math.floor(r/1e3)%60)};tick();setInterval(tick,1000)}
ui();
</script></body></html>
