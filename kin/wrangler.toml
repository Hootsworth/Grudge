name = "kin-backend"
main = "src/index.ts"
compatibility_date = "2024-04-05"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "kin-db"
database_id = "local-kin-db-id"

# Cron Trigger (combined 05:00 UTC generation and 06:00 UTC fallback/publish)
[triggers]
crons = ["0 5,6 * * *"]
