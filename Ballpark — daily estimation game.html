<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ballpark — close enough counts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{--bg:#efe8d8;--ink:#1c2a2b;--card:#fbf6e8;--mute:#7b7766;--line:#d9cfb6;--red:#e4452f;--teal:#1f7a72;--sun:#f0b429;--sky:#4d8dff;--ok:#2f9e6e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121c1c;--ink:#f1ead8;--card:#1b2a2a;--mute:#8fa09a;--line:#2b3d3c}}
:root[data-theme="dark"]{--bg:#121c1c;--ink:#f1ead8;--card:#1b2a2a;--mute:#8fa09a;--line:#2b3d3c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Sora,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
.mono{font-family:"Space Mono",ui-monospace,Menlo,monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.logo{font-weight:800;font-size:1.6rem;letter-spacing:-.05em;display:flex;align-items:center;gap:10px}
.logo svg{width:34px;height:20px}
.pill{background:var(--ink);color:var(--bg);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.82rem;font-variant-numeric:tabular-nums}
.card{background:var(--card);border-radius:28px;padding:24px 20px;border:3px solid var(--ink);animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.kick{color:var(--mute);margin:0 0 10px}
h1,h2{margin:0;font-weight:800;letter-spacing:-.045em;line-height:1.05}
h1{font-size:clamp(2.3rem,10.5vw,3.4rem)}h1 em{font-style:normal;color:var(--red)}
h2.q{font-size:clamp(1.45rem,6.2vw,1.95rem);margin-bottom:10px}
.unit{color:var(--teal);margin:0 0 18px}
.lede{color:var(--mute);line-height:1.55;margin:14px 0 22px}
.ro{text-align:center;margin:6px 0 14px}
.num{font-size:clamp(2.4rem,11vw,3.6rem);font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.sci{color:var(--mute);margin-top:4px}
.rule{position:relative;height:132px;margin:0 -4px;border-radius:16px;background:var(--bg);border:3px solid var(--ink);overflow:hidden;touch-action:none;cursor:ew-resize;user-select:none}
.rule svg{position:absolute;inset:0;width:100%;height:100%}
.cur{position:absolute;top:0;bottom:0;width:60px;margin-left:-30px;background:rgba(255,255,255,.28);border-left:2px solid var(--ink);border-right:2px solid var(--ink);z-index:3;transition:left .08s linear}
.cur::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--red)}
.cur::after{content:"";position:absolute;left:50%;top:-1px;width:16px;height:16px;margin-left:-8px;background:var(--red);clip-path:polygon(0 0,100% 0,50% 100%)}
.tf{position:absolute;top:0;bottom:0;width:0;z-index:2;display:none}
.tf::before{content:"";position:absolute;left:-1px;top:0;bottom:0;width:3px;background:var(--sun)}
.tf b{position:absolute;left:0;top:8px;transform:translateX(-50%);background:var(--sun);color:#1c2a2b;font:700 .62rem "Space Mono",monospace;letter-spacing:.1em;padding:3px 8px;border-radius:6px;white-space:nowrap}
.tf.show{display:block;animation:drop .7s cubic-bezier(.2,1.5,.4,1) both}
.br{position:absolute;top:58%;height:8px;background:var(--red);border-radius:4px;z-index:1;opacity:.8;transform-origin:left;animation:grow .6s .35s cubic-bezier(.2,.8,.2,1) both}
.st{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0 18px;color:var(--mute)}
.st button{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--card);color:var(--ink);font:800 1.3rem Sora,sans-serif;cursor:pointer}.st button:active{transform:scale(.92)}
.btn{width:100%;font:800 1.02rem Sora,sans-serif;border:0;border-radius:999px;background:var(--ink);color:var(--bg);padding:16px;cursor:pointer;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}
.res{margin:16px 0 4px;animation:rise .5s both}
.res .v{font-size:1.9rem;font-weight:800;letter-spacing:-.05em;line-height:1}.res .v.g{color:var(--ok)}.res .v.b{color:var(--red)}
.res p{color:var(--mute);line-height:1.5;margin:8px 0 14px;font-size:.92rem}
.rw{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;font-weight:600;margin:4px 0}
.big{font-size:clamp(3.6rem,17vw,5.4rem);font-weight:800;letter-spacing:-.06em;line-height:.9;margin:6px 0 6px;font-variant-numeric:tabular-nums}.big small{font-size:.3em;color:var(--mute);letter-spacing:-.01em}
.lr{display:grid;grid-template-columns:1fr 84px auto;gap:10px;align-items:center;margin:9px 0;font-weight:600;font-size:.85rem}.lr span{height:12px;border-radius:6px;background:var(--line);overflow:hidden}.lr i{display:block;height:100%;background:var(--teal);border-radius:6px;animation:gw .9s cubic-bezier(.2,.8,.2,1) both}
.cd{margin-top:12px;color:var(--mute)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
@keyframes drop{from{opacity:0;transform:translateY(-40px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes gw{from{width:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main>
<header><div class="logo"><svg viewBox="0 0 34 20"><rect x="1.5" y="1.5" width="31" height="17" rx="4" fill="none" stroke="currentColor" stroke-width="3"/><path d="M9 1.5v7M17 1.5v5M25 1.5v7" stroke="currentColor" stroke-width="3"/><rect x="14" y="0" width="5" height="20" fill="var(--red)"/></svg>Ballpark</div><div class="pill" id="sc">0 pts</div></header>
<div id="v"></div>
</main>
<script>
const SETS=[[
{q:"How many times does a human heart beat in an 80-year life?",u:"heartbeats",v:2.9e9,e:"About 70 beats a minute for 80 years comes to roughly 3 billion beats."},
{q:"How many ants are alive on Earth right now?",u:"ants",v:2e16,e:"A 2022 study estimated about 20 quadrillion ants."},
{q:"If you stacked pennies from Earth to the Moon, how many would you need?",u:"pennies",v:2.5e11,e:"A US penny is 1.52 mm thick and the Moon is about 384,400 km away, so you’d need about 250 billion."},
{q:"How many humans have ever been born?",u:"people",v:1.17e11,e:"Demographers estimate about 117 billion people have ever lived."},
{q:"How many litres of water are in all of Earth’s oceans?",u:"litres",v:1.3e21,e:"The oceans hold about 1.3 billion cubic kilometres, which is 1.3 sextillion litres."}],[
{q:"How many commercial flights take off around the world on a typical day?",u:"flights",v:1e5,e:"Roughly 100,000 flights operate worldwide on a typical day."},
{q:"How many cells are in an adult human body?",u:"cells",v:3.7e13,e:"Researchers estimate about 37 trillion."},
{q:"How many articles are on English Wikipedia?",u:"articles",v:6.9e6,e:"English Wikipedia has roughly 7 million articles."},
{q:"How many years does light take to cross the Milky Way?",u:"years",v:1e5,e:"The galaxy’s disc is about 100,000 light-years across."},
{q:"How many cups of coffee does the world drink in a day?",u:"cups",v:2.2e9,e:"Estimates put it at over two billion cups a day."}]];
const U=[[1e24,"septillion"],[1e21,"sextillion"],[1e18,"quintillion"],[1e15,"quadrillion"],[1e12,"trillion"],[1e9,"billion"],[1e6,"million"],[1e3,"thousand"]];
const $=id=>document.getElementById(id);
function sig(n){if(n<=0)return 0;const f=Math.pow(10,Math.floor(Math.log10(n))-1);return Math.round(n/f)*f}
function fmt(v){const u=U.find(x=>v>=x[0]*.995);if(!u)return String(+sig(v).toFixed(1));return +(sig(v/u[0])).toFixed(1)+" "+u[1]}
const d0=new Date(),T=Math.floor(Date.UTC(d0.getFullYear(),d0.getMonth(),d0.getDate())/864e5),num=T-Math.floor(Date.UTC(2026,0,1)/864e5)+1,KEY="ballpark:"+T,Q=SETS[((T%2)+2)%2];
let S={r:[]},x=9,ph="g",drag=false;
try{const s=localStorage.getItem(KEY);if(s)S=JSON.parse(s)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},total=()=>S.r.reduce((a,r)=>a+r.p,0),orders=()=>S.r.reduce((a,r)=>a+r.err,0);
function stk(){try{return JSON.parse(localStorage.getItem("ballpark:streak")||"{}")}catch(e){return{}}}
function bump(){const s=stk();if(s.t===T)return;s.n=s.last===T-1?(s.n||0)+1:1;s.last=T;s.t=T;try{localStorage.setItem("ballpark:streak",JSON.stringify(s))}catch(e){}}
function pill(){const to=total(),from=+($("sc").dataset.v||0),t0=performance.now();$("sc").dataset.v=to;(function f(n){const p=Math.min(1,(n-t0)/800);$("sc").textContent=Math.round(from+(to-from)*p).toLocaleString("en-US")+" pts";if(p<1)requestAnimationFrame(f)})(t0)}
function scaleSVG(){let o="";const L=["1","K","M","B","T","Qa","Qi","Sx","Sp"];
for(let d=0;d<=24;d++){const X=d/24*1000;o+=`<path d="M${X} 0V${d%3?34:52}" stroke="var(--ink)" stroke-width="${d%3?2:3}"/>`;if(d<24)for(let k=2;k<=9;k++){const mx=(d+Math.log10(k))/24*1000;o+=`<path d="M${mx.toFixed(1)} 0V${k===5?22:14}" stroke="var(--ink)" stroke-width="1.5" opacity=".6"/>`}
if(d%3===0)o+=`<text x="${Math.min(Math.max(X,14),986)}" y="76" text-anchor="middle" font-family="Space Mono,monospace" font-weight="700" font-size="17" fill="var(--ink)">${L[d/3]}</text>`}
return`<svg viewBox="0 0 1000 132" preserveAspectRatio="none" id="sv">${o}</svg>`}
function setX(v){x=Math.min(24,Math.max(0,Math.round(v*100)/100));if($("cur")){$("cur").style.left=x/24*100+"%";$("num").textContent=fmt(Math.pow(10,x));$("sci").textContent="10^"+x.toFixed(1)}}
function intro(){$("v").innerHTML=`<div class="card"><p class="kick mono">Ballpark ${String(num).padStart(3,"0")}</p><h1>Close enough <em>counts.</em></h1><p class="lede">Five absurd quantities. Slide the cursor to your best guess on a scale from one to a septillion. You’re scored on how many orders of magnitude you’re off. Being 10 times too high or too low still stings, but being right to within a factor of 2 earns almost full marks.</p><button class="btn" id="go">Start estimating</button></div>`;$("go").onclick=round}
function round(){const i=S.r.length;if(i>=5)return end();ph="g";x=9;const q=Q[i];
$("v").innerHTML=`<div class="card"><p class="kick mono">Question ${i+1} of 5</p><h2 class="q">${q.q}</h2><p class="unit mono">Answer in: ${q.u}</p>
<div class="ro"><div class="num" id="num"></div><div class="sci mono" id="sci"></div></div>
<div class="rule" id="rule">${scaleSVG()}<div class="tf" id="tf"><b>TRUTH</b></div><div class="cur" id="cur"></div></div>
<div class="st mono"><button id="mn" aria-label="Lower">−</button>fine tune<button id="pl" aria-label="Higher">+</button></div><div id="ft"><button class="btn" id="lk">Lock it in</button></div></div>`;
setX(x);const R=$("rule");
const mv=e=>{if(ph!=="g")return;const b=R.getBoundingClientRect();setX((e.clientX-b.left)/b.width*24)};
R.onpointerdown=e=>{drag=true;R.setPointerCapture(e.pointerId);mv(e)};R.onpointermove=e=>{if(drag)mv(e)};R.onpointerup=()=>drag=false;
$("mn").onclick=()=>ph==="g"&&setX(x-.1);$("pl").onclick=()=>ph==="g"&&setX(x+.1);
$("lk").onclick=()=>{if(ph!=="g")return;ph="r";const t=Math.log10(q.v),err=Math.abs(x-t),p=Math.round(1000*Math.max(0,1-err/2.5));S.r.push({x,err,p});save();pill();reveal(q,t,err,p)}}
function reveal(q,t,err,p){const tf=$("tf"),R=$("rule"),a=Math.min(x,t)/24*100,w=Math.abs(x-t)/24*100;tf.style.left=t/24*100+"%";tf.classList.add("show");
if(w>0.3){const b=document.createElement("div");b.className="br";b.style.left=a+"%";b.style.width=w+"%";R.appendChild(b)}
const g=Math.pow(10,x),r=g/q.v,fac=r>=1?r:1/r,last=S.r.length>=5,spot=err<0.15,
txt=spot?"Spot on.":"Off by ×"+(fac>=100?Math.round(fac).toLocaleString("en-US"):fac.toFixed(1))+(r>=1?" too high":" too low");
$("num").textContent=fmt(q.v);$("sci").textContent="The truth";document.querySelector(".st").style.display="none";
$("ft").innerHTML=`<div class="res"><div class="v ${err<.5?"g":"b"}">${txt}</div><p>${q.e}</p><div class="rw"><span class="mono" style="color:var(--mute)">You said</span><span>${fmt(g)}</span></div><div class="rw"><span class="mono" style="color:var(--mute)">Points</span><span>+${p} of 1,000</span></div><button class="btn" id="nx" style="margin-top:14px">${last?"See results":"Next question"}</button></div>`;
$("nx").onclick=()=>{if(last)bump();round()}}
function end(){const t=total(),o=orders(),ttl=o<.5?"Human calculator":o<1.5?"Fermi’s apprentice":o<3?"Napkin mathematician":o<6?"Vibes-based estimator":"Order of magnitude? Never heard of her",
sh="Ballpark #"+num+"  "+t.toLocaleString("en-US")+" / 5,000  (off by "+o.toFixed(1)+" orders)\n"+S.r.map(r=>r.err<.3?"■":r.err<1?"▲":"□").join("");
$("v").innerHTML=`<div class="card"><p class="kick mono">Final score</p><div class="big" id="bg">0<small> / 5,000</small></div><h2 style="font-size:1.4rem;margin:4px 0 6px">${ttl}.</h2><p class="lede" style="margin:0 0 14px">In total you were off by <b style="color:var(--ink)">${o.toFixed(1)} orders of magnitude</b>.</p>
${S.r.map((r,i)=>`<div class="lr"><b>${Q[i].u}</b><span><i style="width:${r.p/10}%"></i></span><b>${r.p}</b></div>`).join("")}
<button class="btn" id="cp" style="margin-top:16px">Copy result</button><p class="cd mono" id="cd"></p></div>`;
let n=0;const st=Math.max(1,Math.ceil(t/40)),iv=setInterval(()=>{n=Math.min(t,n+st);$("bg").firstChild.nodeValue=n.toLocaleString("en-US");if(n>=t)clearInterval(iv)},28);
$("cp").onclick=()=>{try{navigator.clipboard.writeText(sh).then(()=>$("cp").textContent="Copied",()=>prompt("Copy:",sh))}catch(e){prompt("Copy:",sh)}};
const tick=()=>{const a=new Date(),r=new Date(a.getFullYear(),a.getMonth(),a.getDate()+1)-a,q=y=>String(y).padStart(2,"0");$("cd").textContent="Next ballpark in "+q(Math.floor(r/36e5))+":"+q(Math.floor(r/6e4)%60)+":"+q(Math.floor(r/1e3)%60)};tick();setInterval(tick,1000)}
document.addEventListener("keydown",e=>{if(ph!=="g"||!$("cur"))return;if(e.key==="ArrowLeft"){setX(x-.05);e.preventDefault()}if(e.key==="ArrowRight"){setX(x+.05);e.preventDefault()}if(e.key==="Enter")$("lk")&&$("lk").click()});
pill();S.r.length?round():intro();
</script></body></html>
