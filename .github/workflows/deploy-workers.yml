name: Deploy Cloudflare Workers (Strata & Kin)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'kin/src/**'
      - 'wrangler.toml'
      - 'kin/wrangler.toml'

jobs:
  deploy-workers:
    name: Deploy Workers to Cloudflare
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Hootsworth'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Check Cloudflare Token
        id: check_cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::notice::CLOUDFLARE_API_TOKEN secret not set. Skipping Cloudflare Workers deployment."
          fi

      - name: Deploy Strata Worker
        if: steps.check_cf.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Deploy Kin Worker
        if: steps.check_cf.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'kin'
          command: deploy
