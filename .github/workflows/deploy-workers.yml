name: Deploy Cloudflare Workers (Strata, Kin, PassPhew, Pinpoint, Ballpark, Rungs, Sprint & Blackout)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'kin/src/**'
      - 'passphew/src/**'
      - 'pinpoint/worker/**'
      - 'ballpark/src/**'
      - 'rungs/src/**'
      - 'sprint/src/**'
      - 'blackout/src/**'
      - 'quipher/src/**'
      - 'wrangler.toml'
      - 'kin/wrangler.toml'
      - 'passphew/wrangler.toml'
      - 'pinpoint/wrangler.toml'
      - 'ballpark/wrangler.toml'
      - 'rungs/wrangler.toml'
      - 'sprint/wrangler.toml'
      - 'blackout/wrangler.toml'
      - 'quipher/wrangler.toml'

jobs:
  deploy-workers:
    name: Deploy Workers to Cloudflare
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Hootsworth'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Cloudflare Token
        id: check_cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::notice::CLOUDFLARE_API_TOKEN secret not set. Skipping Cloudflare Workers deployment."
          fi

      - name: Provision D1 Databases & Resolve IDs
        if: steps.check_cf.outputs.has_token == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRATA_DATABASE_ID: ${{ secrets.STRATA_DATABASE_ID }}
          KIN_DATABASE_ID: ${{ secrets.KIN_DATABASE_ID }}
          PASSPHEW_DATABASE_ID: ${{ secrets.PASSPHEW_DATABASE_ID }}
          PINPOINT_DATABASE_ID: ${{ secrets.PINPOINT_DATABASE_ID }}
          PINPOINT_KV_ID: ${{ secrets.PINPOINT_KV_ID }}
          BALLPARK_DATABASE_ID: ${{ secrets.BALLPARK_DATABASE_ID }}
          RUNGS_DATABASE_ID: ${{ secrets.RUNGS_DATABASE_ID }}
          SPRINT_DATABASE_ID: ${{ secrets.SPRINT_DATABASE_ID }}
          BLACKOUT_DATABASE_ID: ${{ secrets.BLACKOUT_DATABASE_ID }}
          QUIPHER_DATABASE_ID: ${{ secrets.QUIPHER_DATABASE_ID }}
        run: |
          node scripts/setup_cf_d1.js

      - name: Deploy All 9 Cloudflare Workers with Auto-Retry
        if: steps.check_cf.outputs.has_token == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/deploy_workers.mjs
