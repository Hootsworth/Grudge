name: Deploy Grudge Hub to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**.html'
      - '**.json'
      - '**.css'
      - '**.js'
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily Fibber Puzzle Pipeline"]
    types:
      - completed

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Pages Artifact Directory
        run: |
          mkdir -p _site
          # Copy all root HTML pages (index, fibber, strata, kin, passphew, admin, etc.)
          cp -f *.html _site/ 2>/dev/null || true

          # Copy images, icons, and static assets
          cp -f *.png _site/ 2>/dev/null || true
          cp -f *.ico _site/ 2>/dev/null || true
          cp -f *.svg _site/ 2>/dev/null || true

          # Copy daily JSON data files
          cp -f *.json _site/ 2>/dev/null || true
          if [ -d "public" ]; then
            cp -rf public/* _site/ 2>/dev/null || true
          fi

          # Disable Jekyll processing on GitHub Pages to preserve all files
          touch _site/.nojekyll

          echo "Prepared _site directory contents:"
          ls -la _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
