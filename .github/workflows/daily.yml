name: Daily Fibber Puzzle Pipeline

on:
  schedule:
    # 03:00 UTC: Daily generation & review gate
    - cron: '0 3 * * *'
    # 06:00 UTC: Fallback check (deploys backlog if unapproved)
    - cron: '0 6 * * *'
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      action:
        description: 'Pipeline Action to run'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'generate'
          - 'approve'
          - 'fallback'
      dry_run:
        description: 'Run in dry-run mode (uses fixture data without API keys)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: daily-fibber
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Daily Puzzle (03:00 UTC)
    # Run at 03:00 UTC or manual dispatch with generate/auto
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.action == 'generate' || github.event.inputs.action == 'auto'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest tests/ -v

      - name: Execute generation pipeline
        env:
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          SEARCH_PROVIDER: ${{ secrets.SEARCH_PROVIDER }}
        run: |
          DRY_RUN_FLAG=""
          HAS_KEY="${{ secrets.AI_API_KEY || secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY || secrets.OPENAI_API_KEY || secrets.ANTHROPIC_API_KEY || secrets.META_API_KEY || secrets.GROQ_API_KEY }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ] || [ -z "$HAS_KEY" ]; then
            echo "Running in dry-run mode (no AI key found or dry_run=true)..."
            DRY_RUN_FLAG="--dry-run"
          fi
          python -m fibber.main $DRY_RUN_FLAG

      - name: Generate Issue Preview Markdown
        id: preview
        run: |
          python -m fibber.main --format-preview > preview.md
          cat preview.md

      - name: Open Review Gate GitHub Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const previewBody = fs.readFileSync('preview.md', 'utf8');
            const today = new Date().toISOString().split('T')[0];
            const title = `🧩 Daily Puzzle Review [${today}]`;

            // Search for existing open review issue for today
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'needs-approval'
            });

            const existing = issues.data.find(i => i.title.includes(today));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: previewBody
              });
              console.log(`Updated existing review issue #${existing.number}`);
            } else {
              const newIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: previewBody,
                labels: ['needs-approval']
              });
              console.log(`Created review issue #${newIssue.data.number}`);
            }

      - name: Commit and push pending puzzle & archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending/ archive/ used.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(daily): generate pending puzzle for $(date -u +%Y-%m-%d)"
          git push

  approve:
    name: Approve & Publish Puzzle
    # Run when an issue is labeled 'approved', or workflow_dispatch action 'approve'
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'approved') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'approve')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Approve and copy pending to public
        run: |
          python -m fibber.main --approve

      - name: Commit and push published puzzle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/ today.json
          git diff --quiet && git diff --staged --quiet || git commit -m "feat(daily): publish approved puzzle for $(date -u +%Y-%m-%d)"
          git push

      - name: Close Review Issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "🎉 **Puzzle Approved!** It is now live in `public/today.json`."
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

  fallback:
    name: Fallback Check (06:00 UTC)
    # Run at 06:00 UTC, or manual dispatch with fallback
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'fallback')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check if today's puzzle is already published
        id: check_status
        run: |
          python -c '
          import os, json, datetime
          today = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
          pub_path = "public/today.json"
          if os.path.exists(pub_path):
              with open(pub_path) as f:
                  data = json.load(f)
              if data.get("date") == today:
                  print("already_published=true")
                  exit(0)
          print("already_published=false")
          ' >> $GITHUB_OUTPUT

      - name: Deploy pre-approved backlog puzzle
        if: steps.check_status.outputs.already_published == 'false'
        run: |
          python -m fibber.main --fallback

      - name: Commit and push fallback puzzle
        if: steps.check_status.outputs.already_published == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/ today.json
          git diff --quiet && git diff --staged --quiet || git commit -m "fix(daily): deploy fallback backlog puzzle for $(date -u +%Y-%m-%d)"
          git push

      - name: Notify Review Issue of Fallback
        if: steps.check_status.outputs.already_published == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const today = new Date().toISOString().split('T')[0];
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'needs-approval'
            });
            const existing = issues.data.find(i => i.title.includes(today));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: "⚠️ **06:00 UTC Review Deadline Reached.** No manual approval was received. A pre-approved puzzle from `/backlog/` has been automatically deployed to ensure players always have today's puzzle."
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed'
              });
            }
